      description: 'Discovers individual IP addresses associated with MX hosts for DNSBL checking.'
      item_prototypes:
      - uuid: 17cdad41489b47c2b649b79a1478d79b
        name: 'MX IP listed flag [{#MXIP}]'
        key: 'mail.mx.ip.listed[{#MXIP}]'
        type: DEPENDENT
        master_item:
          key: 'mail.dns.audit[{HOST.NAME},{$DNS_RESOLVER},{$DNS_TIMEOUT_SEC},{$CHECK_IPV6},{$DNSBL_ZONES},{$CIDR_ALLOWLIST},{$SPF_MAX_LOOKUPS},{$SPF_EXPECT_ALL},{$DNSBL_CACHE_TTL_SEC},{$MAX_MX_CHECK},{$DNSBL_MAX_IP},{$DKIM_SELECTORS},{$DNS_SHUFFLE}]'
        value_type: UNSIGNED
        preprocessing:
        - type: JSONPATH
          parameters:
          - '$.dnsbl.listed[?(@.ip=="{#MXIP}")].zone'
          error_handler: DISCARD_VALUE
        - type: JAVASCRIPT
          parameters:
          - |
            var v = value;
            try { v = JSON.parse(value); } catch (e) {}
            if (Array.isArray(v)) { return v.length > 0 ? 1 : 0; }
            return v ? 1 : 0;
        description: 'Flag indicating if the IP {#MXIP} is listed in any monitored DNSBL (1 = Yes, 0 = No).'
        tags:
        - tag: Application
          value: Mail DNS
      - uuid: 4f7bb0d6b7d048d6a3a4c7b09239a322
        name: 'MX IP listed zone [{#MXIP}]'
        key: 'mail.mx.ip.listed.zone[{#MXIP}]'
        type: DEPENDENT
        master_item:
          key: 'mail.dns.audit[{HOST.NAME},{$DNS_RESOLVER},{$DNS_TIMEOUT_SEC},{$CHECK_IPV6},{$DNSBL_ZONES},{$CIDR_ALLOWLIST},{$SPF_MAX_LOOKUPS},{$SPF_EXPECT_ALL},{$DNSBL_CACHE_TTL_SEC},{$MAX_MX_CHECK},{$DNSBL_MAX_IP},{$DKIM_SELECTORS},{$DNS_SHUFFLE}]'
        value_type: TEXT
        trends: '0'
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - |
            try {
              var obj = typeof value === 'string' ? JSON.parse(value) : value;
              if (obj && obj.dnsbl && Array.isArray(obj.dnsbl.listed)) {
                for (var i=0;i<obj.dnsbl.listed.length;i++) {
                  if (obj.dnsbl.listed[i].ip === "{#MXIP}") {
                    var z = obj.dnsbl.listed[i].zone;
                    if (z && z !== '') { return z; }
                  }
                }
              }
            } catch(e) {}
            return '*UNKNOWN*';
        description: 'The name of the DNSBL zone where the IP {#MXIP} was found.'
        tags:
        - tag: Application
          value: Mail DNS
      - uuid: 5c0e0a544e6b4c74954b0f12abf7e5d4
        name: 'MX IP listed status [{#MXIP}]'
        key: 'mail.mx.ip.listed.status[{#MXIP}]'
        type: DEPENDENT
        master_item:
          key: 'mail.dns.audit[{HOST.NAME},{$DNS_RESOLVER},{$DNS_TIMEOUT_SEC},{$CHECK_IPV6},{$DNSBL_ZONES},{$CIDR_ALLOWLIST},{$SPF_MAX_LOOKUPS},{$SPF_EXPECT_ALL},{$DNSBL_CACHE_TTL_SEC},{$MAX_MX_CHECK},{$DNSBL_MAX_IP},{$DKIM_SELECTORS},{$DNS_SHUFFLE}]'
        value_type: TEXT
        trends: '0'
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - |
            try {
              var obj = typeof value === 'string' ? JSON.parse(value) : value;
              var entries = (obj && obj.dnsbl && Array.isArray(obj.dnsbl.entries)) ? obj.dnsbl.entries : [];
              var statuses = [];
              for (var i=0;i<entries.length;i++) {
                var e = entries[i];
                if (e && e.ip === "{#MXIP}") {
                  if (e.status) { statuses.push(e.status); }
                }
              }
              if (statuses.indexOf("LISTED") !== -1) return "LISTED";
              if (statuses.indexOf("POLICY/ERROR") !== -1) return "POLICY/ERROR";
              if (statuses.indexOf("CHECK FAILED") !== -1) return "CHECK FAILED";
              if (statuses.length === 0) return "NOT LISTED";
              return statuses[0];
            } catch (e) {
              return "UNKNOWN";
            }
        description: 'Normalized DNSBL check status for IP {#MXIP}: LISTED, NOT LISTED, POLICY/ERROR, or CHECK FAILED.'
        tags:
        - tag: Application
          value: Mail DNS
      - uuid: 7f7ff6283d184a699b604e6a46c5a1cb
        name: 'MX IP listed TXT [{#MXIP}]'
        key: 'mail.mx.ip.listed.txt[{#MXIP}]'
        type: DEPENDENT
        master_item:
          key: 'mail.dns.audit[{HOST.NAME},{$DNS_RESOLVER},{$DNS_TIMEOUT_SEC},{$CHECK_IPV6},{$DNSBL_ZONES},{$CIDR_ALLOWLIST},{$SPF_MAX_LOOKUPS},{$SPF_EXPECT_ALL},{$DNSBL_CACHE_TTL_SEC},{$MAX_MX_CHECK},{$DNSBL_MAX_IP},{$DKIM_SELECTORS},{$DNS_SHUFFLE}]'
        value_type: TEXT
        trends: '0'
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - |
            try {
              var obj = typeof value === 'string' ? JSON.parse(value) : value;
              var entries = (obj && obj.dnsbl && Array.isArray(obj.dnsbl.entries)) ? obj.dnsbl.entries : [];
              var txts = [];
              for (var i=0;i<entries.length;i++) {
                var e = entries[i];
                if (e && e.ip === "{#MXIP}" && Array.isArray(e.txt)) {
                  txts = txts.concat(e.txt);
                }
              }
              return txts.length ? txts.join("; ") : "*NONE*";
            } catch (e) {
              return "*NONE*";
            }
        description: 'Detailed TXT explanation from the DNSBL provider for IP {#MXIP}.'
        tags:
        - tag: Application
          value: Mail DNS
      trigger_prototypes:
      - uuid: 6e43d4d3f8f44f1ea4e7fd5fce6cb9e4
        name: 'MX {#MXHOST} IP {#MXIP} listed in DNSBL {ITEM.LASTVALUE2}'
        expression: 'last(/Template Mail DNS Audit Zabbix/mail.mx.ip.listed[{#MXIP}])=1 and last(/Template Mail DNS Audit Zabbix/mail.mx.ip.listed.zone[{#MXIP}])<>"*UNKNOWN*"'
        priority: HIGH
        manual_close: 'YES'
        description: 'Alert when an MX IP address is found in a blackhole list.'
        tags:
        - tag: component
          value: mail-dns
        - tag: Application
          value: Mail DNS
      - uuid: 0a2c5e1a0a434f7e9f6a55bfe0ec74d1
        name: 'MX {#MXHOST} IP {#MXIP} DNSBL policy/error: {ITEM.LASTVALUE2}'
        expression: 'last(/Template Mail DNS Audit Zabbix/mail.mx.ip.listed.status[{#MXIP}])="POLICY/ERROR" and length(last(/Template Mail DNS Audit Zabbix/mail.mx.ip.listed.txt[{#MXIP}]))>=0'
        priority: WARNING
        manual_close: 'YES'
        description: 'Alert when a DNSBL provider blocks your query due to policy (e.g., open resolver, rate limits).'
        tags:
        - tag: component
