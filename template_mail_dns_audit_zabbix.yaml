          value_type: FLOAT
          description: "How many DNS lookups failed this run (timeout, SERVFAIL) rather than answering 'there is nothing here'. Above zero means the run saw an incomplete picture, so any 'record is missing' verdict from it is unsafe: absence can only be claimed from a complete look. -1 means the running script predates this field, i.e. not measured - deliberately distinct from 0 so the absence guards stay closed rather than opening on an unmeasured run. The 'record missing' triggers require this to be exactly 0."
