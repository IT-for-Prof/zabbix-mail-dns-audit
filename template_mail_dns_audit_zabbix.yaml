                  value: 'Mail DNS'
                - tag: component
                  value: mail-dns
        - uuid: a9e2999d230c4138a85a8749b1ff386b
          name: 'DNSBL zones failing self-test'
          type: DEPENDENT
          key: mail.dnsbl.canary.failed
          delay: '0'
          value_type: FLOAT
          description: "How many configured DNSBL zones did NOT return the canary address, i.e. cannot prove they still hold data and still answer us. 0 = every zone proved itself. -1 = the self-test is not configured ({$DNSBL_TEST_IP} empty) or the payload was unreadable, which is deliberately distinct from 0 so that 'not measured' never looks like 'fine'."
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  try {
                    var o = JSON.parse(value);
                    var t = (o && o.dnsbl && o.dnsbl.test) ? o.dnsbl.test : null;
                    if (!t || !Array.isArray(t.entries) || t.entries.length === 0) return -1;
                    var bad = 0;
                    for (var i = 0; i < t.entries.length; i++) {
                      if (t.entries[i].status !== 'LISTED') bad++;
                    }
                    return bad;
                  } catch (e) {
                    return -1;
                  }
          master_item:
            key: 'mail.dns.audit[{HOST.HOST},{$DNS_RESOLVER},{$DNS_TIMEOUT_SEC},{$CHECK_IPV6},{$DNSBL_ZONES},{$CIDR_ALLOWLIST},{$SPF_MAX_LOOKUPS},{$SPF_EXPECT_ALL},{$DNSBL_CACHE_TTL_SEC},{$MAX_MX_CHECK},{$DNSBL_MAX_IP},{$DKIM_SELECTORS},{$DNS_SHUFFLE},--dnsbl-test-ip={$DNSBL_TEST_IP}]'
          tags:
            - tag: Application
              value: 'Mail DNS'
          triggers:
            - uuid: 9bc086e655b24abf873e8609a2fb1bcd
              expression: 'min(/Template Mail DNS Audit Zabbix/mail.dnsbl.canary.failed,#2)>0'
              name: '{HOST.HOST}: DNSBL zone cannot prove it is alive ({ITEM.LASTVALUE1} of the configured zones)'
              priority: WARNING
              description: "A working blocklist lists the canary address 127.0.0.2 by convention. A zone that does not return it is either emptied (SORBS was decommissioned in June 2024 and now answers NXDOMAIN to everything) or refusing our queries from this proxy's egress IP. Either way its 'not listed' answers prove nothing, and the DNSBL check for this host is running blind against that zone. Fix: verify with `dig 2.0.0.127.<zone>` from the proxy that serves this host, then either get the querying IP unblocked or remove the zone from {$DNSBL_ZONES}. Requires two consecutive failed polls so a single transient resolver blip does not raise this."
              dependencies:
                - name: 'DNS audit script error on {HOST.HOST}: {ITEM.LASTVALUE}'
                  expression: 'length(last(/Template Mail DNS Audit Zabbix/mail.dns.error))>0'
                  recovery_expression: ''
              tags:
                - tag: Application
                  value: 'Mail DNS'
                - tag: component
                  value: mail-dns
