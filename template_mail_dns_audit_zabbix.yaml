              expression: 'min(/Template Mail DNS Audit Zabbix/mail.ns.unanswered,#2)>0'
              name: '{HOST.HOST}: {ITEM.LASTVALUE1} nameserver(s) do not answer SOA'
              priority: WARNING
              description: 'One or more nameservers listed in the delegation did not return a SOA record when queried directly, on two consecutive polls. Resolution still works while the others answer, but the zone is one failure away from trouble and the serial-consistency check is blind to the silent server -- a server that never answers contributes no serial, so the mismatch counter stays at zero. Two polls are required because a single missed SOA is ordinary transient noise: this trigger fired on its first day from one such blip, and the same lesson produced the #2 guard on the PTR and DNSBL triggers.'
