        - uuid: 3d5b1dc63d8a407a895e3d5844a94146
          name: 'MX discovery'
          type: DEPENDENT
          key: mail.mx.discovery
          delay: '0'
          description: 'Discovers hostnames and priorities from domain MX records.'
          item_prototypes:
            - uuid: 0aff53b03fc64db4a6f5e42157d210ef
              name: 'CNAME target for {#MXHOST}'
              type: DEPENDENT
              key: 'mail.mx.host.cname[{#MXHOST}]'
              delay: '0'
              value_type: TEXT
              trends: '0'
              description: 'The CNAME this MX host resolves through, or *NONE*. RFC 5321 section 5.1 forbids an MX target from being an alias.'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      try {
                        var o = typeof value === "string" ? JSON.parse(value) : value;
                        var m = Array.isArray(o && o.mx) ? o.mx : [];
                        for (var i=0;i<m.length;i++) { if (m[i] && m[i].host === "{#MXHOST}") { return m[i].cname || "*NONE*"; } }
                        return "*NONE*";
                      } catch (err) { return "*NONE*"; }

              master_item:
                key: 'mail.dns.audit[{HOST.HOST},{$DNS_RESOLVER},{$DNS_TIMEOUT_SEC},{$CHECK_IPV6},{$DNSBL_ZONES},{$CIDR_ALLOWLIST},{$SPF_MAX_LOOKUPS},{$SPF_EXPECT_ALL},{$DNSBL_CACHE_TTL_SEC},{$MAX_MX_CHECK},{$DNSBL_MAX_IP},{$DKIM_SELECTORS},{$DNS_SHUFFLE},--dnsbl-test-ip={$DNSBL_TEST_IP}]'
              tags:
