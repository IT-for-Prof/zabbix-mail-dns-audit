          description: '1 = autodiscover.<domain> resolves (A or CNAME), 0 = missing. Used by Outlook and Exchange-compatible clients.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.mail_client_config.autodiscover.present
              error_handler: CUSTOM_VALUE
              error_handler_params: 'false'
            - type: JAVASCRIPT
              parameters:
                - 'return (value===true || value=="true" || value=="1") ? 1 : 0;'
          master_item:
            key: 'mail.dns.audit[{HOST.HOST},{$DNS_RESOLVER},{$DNS_TIMEOUT_SEC},{$CHECK_IPV6},{$DNSBL_ZONES},{$CIDR_ALLOWLIST},{$SPF_MAX_LOOKUPS},{$SPF_EXPECT_ALL},{$DNSBL_CACHE_TTL_SEC},{$MAX_MX_CHECK},{$DNSBL_MAX_IP},{$DKIM_SELECTORS},{$DNS_SHUFFLE},--dnsbl-test-ip={$DNSBL_TEST_IP}]'
          tags:
            - tag: Application
              value: 'Mail DNS'
          triggers:
            - uuid: 40b29aa5e61f421d8695d6b95c4e96f1
              expression: 'last(/Template Mail DNS Audit Zabbix/mail.autodiscover.present)=0 and {$MAIL_CLIENT_AUTOCONFIG_CHECK}=1'
              name: 'Autodiscover DNS missing for {HOST.HOST}'
              priority: INFO
              description: 'autodiscover.{HOST.HOST} A/CNAME record not found. Outlook and Exchange-compatible clients will not be able to auto-discover mail server settings.'
              dependencies:
                - name: 'DNS audit script error on {HOST.HOST}: {ITEM.LASTVALUE}'
                  expression: 'length(last(/Template Mail DNS Audit Zabbix/mail.dns.error))>0'
                  recovery_expression: ''
              tags:
                - tag: Application
                  value: 'Mail DNS'
                - tag: component
                  value: mail-dns
        - uuid: 10bf7a9380cf49db8c6bf2f38ca2bf26
          name: 'Autodiscover DNS record type'
          type: DEPENDENT
          key: mail.autodiscover.type
          delay: '0'
          value_type: TEXT
          trends: '0'
          description: 'Record type for autodiscover.<domain>: A, CNAME, or MISSING.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.mail_client_config.autodiscover.type
              error_handler: CUSTOM_VALUE
              error_handler_params: MISSING
          master_item:
            key: 'mail.dns.audit[{HOST.HOST},{$DNS_RESOLVER},{$DNS_TIMEOUT_SEC},{$CHECK_IPV6},{$DNSBL_ZONES},{$CIDR_ALLOWLIST},{$SPF_MAX_LOOKUPS},{$SPF_EXPECT_ALL},{$DNSBL_CACHE_TTL_SEC},{$MAX_MX_CHECK},{$DNSBL_MAX_IP},{$DKIM_SELECTORS},{$DNS_SHUFFLE},--dnsbl-test-ip={$DNSBL_TEST_IP}]'
          tags:
            - tag: Application
              value: 'Mail DNS'
        - uuid: 19a3e7fc30c04e199fc044a8349ffb07
          name: 'Autodiscover SRV present'
          type: DEPENDENT
          key: mail.autodiscover_srv.present
          delay: '0'
          description: '1 = _autodiscover._tcp.<domain> SRV record found, 0 = missing. SRV is the fallback autodiscover mechanism.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.mail_client_config.autodiscover_srv.present
              error_handler: CUSTOM_VALUE
              error_handler_params: 'false'
            - type: JAVASCRIPT
              parameters:
                - 'return (value===true || value=="true" || value=="1") ? 1 : 0;'
          master_item:
            key: 'mail.dns.audit[{HOST.HOST},{$DNS_RESOLVER},{$DNS_TIMEOUT_SEC},{$CHECK_IPV6},{$DNSBL_ZONES},{$CIDR_ALLOWLIST},{$SPF_MAX_LOOKUPS},{$SPF_EXPECT_ALL},{$DNSBL_CACHE_TTL_SEC},{$MAX_MX_CHECK},{$DNSBL_MAX_IP},{$DKIM_SELECTORS},{$DNS_SHUFFLE},--dnsbl-test-ip={$DNSBL_TEST_IP}]'
          tags:
            - tag: Application
              value: 'Mail DNS'
          triggers:
            - uuid: cb8901aef1bf4b8b91f3f4e51391a189
              expression: 'last(/Template Mail DNS Audit Zabbix/mail.autoconfig.present)=0 and last(/Template Mail DNS Audit Zabbix/mail.autodiscover.present)=0 and last(/Template Mail DNS Audit Zabbix/mail.autodiscover_srv.present)=0 and {$MAIL_CLIENT_AUTOCONFIG_CHECK}=1'
              name: 'No mail client autoconfiguration for {HOST.HOST}'
              priority: WARNING
              description: 'None of the standard mail client autoconfiguration DNS mechanisms are present (autoconfig A/CNAME, autodiscover A/CNAME, _autodiscover._tcp SRV). Mail clients will fall back to manual configuration or ISP database lookup.'
              dependencies:
                - name: 'DNS audit script error on {HOST.HOST}: {ITEM.LASTVALUE}'
                  expression: 'length(last(/Template Mail DNS Audit Zabbix/mail.dns.error))>0'
                  recovery_expression: ''
              tags:
                - tag: Application
                  value: 'Mail DNS'
                - tag: component
                  value: mail-dns
      discovery_rules:
        - uuid: addc1d564a334496bd00547f47b06549
          name: 'DNSBL zone discovery'
          type: DEPENDENT
          key: mail.dnsbl.zone.discovery
          delay: '0'
          description: 'Discovers the list of DNSBL zones being monitored.'
          item_prototypes:
            - uuid: b1285187ef0940e1a4fcd9526a97c0c3
              name: 'DNSBL zone listed count [{#DNSBL_ZONE}]'
              type: DEPENDENT
              key: 'mail.dnsbl.zone.listed[{#DNSBL_ZONE}]'
              delay: '0'
              description: 'Total number of listed IPs in the specific DNSBL zone {#DNSBL_ZONE}.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.dnsbl.listed[?(@.zone=="{#DNSBL_ZONE}")].length()'
              master_item:
                key: 'mail.dns.audit[{HOST.HOST},{$DNS_RESOLVER},{$DNS_TIMEOUT_SEC},{$CHECK_IPV6},{$DNSBL_ZONES},{$CIDR_ALLOWLIST},{$SPF_MAX_LOOKUPS},{$SPF_EXPECT_ALL},{$DNSBL_CACHE_TTL_SEC},{$MAX_MX_CHECK},{$DNSBL_MAX_IP},{$DKIM_SELECTORS},{$DNS_SHUFFLE},--dnsbl-test-ip={$DNSBL_TEST_IP}]'
              tags:
                - tag: Application
                  value: 'Mail DNS'
          master_item:
            key: 'mail.dns.audit[{HOST.HOST},{$DNS_RESOLVER},{$DNS_TIMEOUT_SEC},{$CHECK_IPV6},{$DNSBL_ZONES},{$CIDR_ALLOWLIST},{$SPF_MAX_LOOKUPS},{$SPF_EXPECT_ALL},{$DNSBL_CACHE_TTL_SEC},{$MAX_MX_CHECK},{$DNSBL_MAX_IP},{$DKIM_SELECTORS},{$DNS_SHUFFLE},--dnsbl-test-ip={$DNSBL_TEST_IP}]'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.lld_dnsbl_zones.data
        - uuid: 3d5b1dc63d8a407a895e3d5844a94146
          name: 'MX discovery'
          type: DEPENDENT
          key: mail.mx.discovery
          delay: '0'
          description: 'Discovers hostnames and priorities from domain MX records.'
          item_prototypes:
            - uuid: c63fc9faa5d447efb6d82ff8d4f0198b
              name: 'MX host IPv6 list [{#MXHOST}]'
              type: DEPENDENT
              key: 'mail.mx.host.aaaa[{#MXHOST}]'
              delay: '0'
              value_type: TEXT
              trends: '0'
              description: 'List of IPv6 addresses (AAAA records) for the MX host {#MXHOST}.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.mx[?(@.host=="{#MXHOST}")].aaaa'
              master_item:
                key: 'mail.dns.audit[{HOST.HOST},{$DNS_RESOLVER},{$DNS_TIMEOUT_SEC},{$CHECK_IPV6},{$DNSBL_ZONES},{$CIDR_ALLOWLIST},{$SPF_MAX_LOOKUPS},{$SPF_EXPECT_ALL},{$DNSBL_CACHE_TTL_SEC},{$MAX_MX_CHECK},{$DNSBL_MAX_IP},{$DKIM_SELECTORS},{$DNS_SHUFFLE},--dnsbl-test-ip={$DNSBL_TEST_IP}]'
              tags:
                - tag: Application
                  value: 'Mail DNS'
            - uuid: a9b436b9dfc749beb6c9e137cb64e614
              name: 'MX host IPv4 list [{#MXHOST}]'
              type: DEPENDENT
              key: 'mail.mx.host.a[{#MXHOST}]'
              delay: '0'
              value_type: TEXT
              trends: '0'
              description: 'List of IPv4 addresses (A records) for the MX host {#MXHOST}.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.mx[?(@.host=="{#MXHOST}")].a'
              master_item:
                key: 'mail.dns.audit[{HOST.HOST},{$DNS_RESOLVER},{$DNS_TIMEOUT_SEC},{$CHECK_IPV6},{$DNSBL_ZONES},{$CIDR_ALLOWLIST},{$SPF_MAX_LOOKUPS},{$SPF_EXPECT_ALL},{$DNSBL_CACHE_TTL_SEC},{$MAX_MX_CHECK},{$DNSBL_MAX_IP},{$DKIM_SELECTORS},{$DNS_SHUFFLE},--dnsbl-test-ip={$DNSBL_TEST_IP}]'
              tags:
                - tag: Application
                  value: 'Mail DNS'
            - uuid: c79957e5ec6849b79f9e2c7831a977e8
              name: 'MX host TTL [{#MXHOST}]'
              type: DEPENDENT
              key: 'mail.mx.host.ttl[{#MXHOST}]'
              delay: '0'
              units: s
              description: 'Time-to-Live (TTL) value for the MX host {#MXHOST}.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.mx[?(@.host=="{#MXHOST}")].ttl'
                - type: JAVASCRIPT
                  parameters:
                    - |
                      try {
                        var v = JSON.parse(value);
                        if (Array.isArray(v) && v.length > 0) return v[0];
                        return v;
                      } catch (e) { return 0; }
              master_item:
                key: 'mail.dns.audit[{HOST.HOST},{$DNS_RESOLVER},{$DNS_TIMEOUT_SEC},{$CHECK_IPV6},{$DNSBL_ZONES},{$CIDR_ALLOWLIST},{$SPF_MAX_LOOKUPS},{$SPF_EXPECT_ALL},{$DNSBL_CACHE_TTL_SEC},{$MAX_MX_CHECK},{$DNSBL_MAX_IP},{$DKIM_SELECTORS},{$DNS_SHUFFLE},--dnsbl-test-ip={$DNSBL_TEST_IP}]'
              tags:
                - tag: Application
                  value: 'Mail DNS'
          master_item:
            key: 'mail.dns.audit[{HOST.HOST},{$DNS_RESOLVER},{$DNS_TIMEOUT_SEC},{$CHECK_IPV6},{$DNSBL_ZONES},{$CIDR_ALLOWLIST},{$SPF_MAX_LOOKUPS},{$SPF_EXPECT_ALL},{$DNSBL_CACHE_TTL_SEC},{$MAX_MX_CHECK},{$DNSBL_MAX_IP},{$DKIM_SELECTORS},{$DNS_SHUFFLE},--dnsbl-test-ip={$DNSBL_TEST_IP}]'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.lld_mx.data
        - uuid: 47003523826443cd8fad42efbda55c6e
          name: 'MX IP discovery'
          type: DEPENDENT
          key: mail.mx.ip.discovery
          delay: '0'
          description: 'Discovers individual IP addresses associated with MX hosts for DNSBL checking.'
          item_prototypes:
            - uuid: 5c0e0a544e6b4c74954b0f12abf7e5d4
              name: 'MX IP listed status [{#MXIP}]'
              type: DEPENDENT
              key: 'mail.mx.ip.listed.status[{#MXIP}]'
              delay: '0'
              value_type: TEXT
              trends: '0'
              description: 'Normalized DNSBL check status for IP {#MXIP}: LISTED, NOT LISTED, POLICY/ERROR, or CHECK FAILED.'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      try {
                        var obj = typeof value === 'string' ? JSON.parse(value) : value;
                        var entries = (obj && obj.dnsbl && Array.isArray(obj.dnsbl.entries)) ? obj.dnsbl.entries : [];
                        var statuses = [];
                        for (var i=0;i<entries.length;i++) {
                          var e = entries[i];
                          if (e && e.ip === "{#MXIP}") {
                            if (e.status) { statuses.push(e.status); }
                          }
                        }
                        if (statuses.indexOf("LISTED") !== -1) return "LISTED";
                        if (statuses.indexOf("POLICY/ERROR") !== -1) return "POLICY/ERROR";
                        if (statuses.indexOf("CHECK FAILED") !== -1) return "CHECK FAILED";
                        if (statuses.length === 0) return "NOT LISTED";
                        return statuses[0];
                      } catch (e) {
                        return "UNKNOWN";
                      }
              master_item:
                key: 'mail.dns.audit[{HOST.HOST},{$DNS_RESOLVER},{$DNS_TIMEOUT_SEC},{$CHECK_IPV6},{$DNSBL_ZONES},{$CIDR_ALLOWLIST},{$SPF_MAX_LOOKUPS},{$SPF_EXPECT_ALL},{$DNSBL_CACHE_TTL_SEC},{$MAX_MX_CHECK},{$DNSBL_MAX_IP},{$DKIM_SELECTORS},{$DNS_SHUFFLE},--dnsbl-test-ip={$DNSBL_TEST_IP}]'
              tags:
                - tag: Application
                  value: 'Mail DNS'
            - uuid: 7f7ff6283d184a699b604e6a46c5a1cb
              name: 'MX IP listed TXT [{#MXIP}]'
              type: DEPENDENT
              key: 'mail.mx.ip.listed.txt[{#MXIP}]'
              delay: '0'
              value_type: TEXT
              trends: '0'
              description: 'Detailed TXT explanation from the DNSBL provider for IP {#MXIP}.'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      try {
                        var obj = typeof value === 'string' ? JSON.parse(value) : value;
                        var entries = (obj && obj.dnsbl && Array.isArray(obj.dnsbl.entries)) ? obj.dnsbl.entries : [];
                        var txts = [];
                        for (var i=0;i<entries.length;i++) {
                          var e = entries[i];
                          if (e && e.ip === "{#MXIP}" && Array.isArray(e.txt)) {
                            txts = txts.concat(e.txt);
                          }
                        }
                        return txts.length ? txts.join("; ") : "*NONE*";
                      } catch (e) {
                        return "*NONE*";
                      }
              master_item:
                key: 'mail.dns.audit[{HOST.HOST},{$DNS_RESOLVER},{$DNS_TIMEOUT_SEC},{$CHECK_IPV6},{$DNSBL_ZONES},{$CIDR_ALLOWLIST},{$SPF_MAX_LOOKUPS},{$SPF_EXPECT_ALL},{$DNSBL_CACHE_TTL_SEC},{$MAX_MX_CHECK},{$DNSBL_MAX_IP},{$DKIM_SELECTORS},{$DNS_SHUFFLE},--dnsbl-test-ip={$DNSBL_TEST_IP}]'
              tags:
                - tag: Application
                  value: 'Mail DNS'
            - uuid: 4f7bb0d6b7d048d6a3a4c7b09239a322
              name: 'MX IP listed zone [{#MXIP}]'
              type: DEPENDENT
              key: 'mail.mx.ip.listed.zone[{#MXIP}]'
              delay: '0'
              value_type: TEXT
              trends: '0'
              description: 'The name of the DNSBL zone where the IP {#MXIP} was found.'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      try {
                        var obj = typeof value === 'string' ? JSON.parse(value) : value;
                        if (obj && obj.dnsbl && Array.isArray(obj.dnsbl.listed)) {
                          for (var i=0;i<obj.dnsbl.listed.length;i++) {
                            if (obj.dnsbl.listed[i].ip === "{#MXIP}") {
                              var z = obj.dnsbl.listed[i].zone;
                              if (z && z !== '') { return z; }
                            }
                          }
                        }
                      } catch(e) {}
                      return '*UNKNOWN*';
              master_item:
                key: 'mail.dns.audit[{HOST.HOST},{$DNS_RESOLVER},{$DNS_TIMEOUT_SEC},{$CHECK_IPV6},{$DNSBL_ZONES},{$CIDR_ALLOWLIST},{$SPF_MAX_LOOKUPS},{$SPF_EXPECT_ALL},{$DNSBL_CACHE_TTL_SEC},{$MAX_MX_CHECK},{$DNSBL_MAX_IP},{$DKIM_SELECTORS},{$DNS_SHUFFLE},--dnsbl-test-ip={$DNSBL_TEST_IP}]'
              tags:
                - tag: Application
                  value: 'Mail DNS'
            - uuid: 17cdad41489b47c2b649b79a1478d79b
              name: 'MX IP listed flag [{#MXIP}]'
              type: DEPENDENT
              key: 'mail.mx.ip.listed[{#MXIP}]'
              delay: '0'
              description: 'Flag indicating if the IP {#MXIP} is listed in any monitored DNSBL (1 = Yes, 0 = No).'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.dnsbl.listed[?(@.ip=="{#MXIP}")].zone'
                  error_handler: DISCARD_VALUE
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var v = value;
                      try { v = JSON.parse(value); } catch (e) {}
                      if (Array.isArray(v)) { return v.length > 0 ? 1 : 0; }
                      return v ? 1 : 0;
              master_item:
                key: 'mail.dns.audit[{HOST.HOST},{$DNS_RESOLVER},{$DNS_TIMEOUT_SEC},{$CHECK_IPV6},{$DNSBL_ZONES},{$CIDR_ALLOWLIST},{$SPF_MAX_LOOKUPS},{$SPF_EXPECT_ALL},{$DNSBL_CACHE_TTL_SEC},{$MAX_MX_CHECK},{$DNSBL_MAX_IP},{$DKIM_SELECTORS},{$DNS_SHUFFLE},--dnsbl-test-ip={$DNSBL_TEST_IP}]'
              tags:
                - tag: Application
                  value: 'Mail DNS'
          trigger_prototypes:
            - uuid: 9f3fd9925f1e4b4f81ce3f3c8cfa9a90
              expression: 'last(/Template Mail DNS Audit Zabbix/mail.mx.ip.listed.status[{#MXIP}])="CHECK FAILED" and length(last(/Template Mail DNS Audit Zabbix/mail.mx.ip.listed.txt[{#MXIP}]))>=0'
              name: '{HOST.HOST}: MX {#MXHOST} IP {#MXIP} DNSBL check failed: {ITEM.LASTVALUE2}'
              priority: WARNING
              description: 'Technical failure during DNSBL check. Error: {ITEM.LASTVALUE2}'
              manual_close: 'YES'
              tags:
                - tag: Application
                  value: 'Mail DNS'
                - tag: component
                  value: mail-dns
            - uuid: 0a2c5e1a0a434f7e9f6a55bfe0ec74d1
              expression: 'last(/Template Mail DNS Audit Zabbix/mail.mx.ip.listed.status[{#MXIP}])="POLICY/ERROR" and length(last(/Template Mail DNS Audit Zabbix/mail.mx.ip.listed.txt[{#MXIP}]))>=0'
              name: '{HOST.HOST}: MX {#MXHOST} IP {#MXIP} DNSBL policy/error: {ITEM.LASTVALUE2}'
              priority: WARNING
              description: 'DNSBL provider blocks queries: {ITEM.LASTVALUE2}. Reason: Rate limit or open resolver policy.'
              manual_close: 'YES'
              tags:
                - tag: Application
                  value: 'Mail DNS'
                - tag: component
                  value: mail-dns
            - uuid: 6e43d4d3f8f44f1ea4e7fd5fce6cb9e4
              expression: 'last(/Template Mail DNS Audit Zabbix/mail.mx.ip.listed[{#MXIP}])=1 and last(/Template Mail DNS Audit Zabbix/mail.mx.ip.listed.zone[{#MXIP}])<>"*UNKNOWN*" and length(last(/Template Mail DNS Audit Zabbix/mail.mx.ip.listed.txt[{#MXIP}]))>=0'
              name: '{HOST.HOST}: MX {#MXHOST} IP {#MXIP} listed in DNSBL {ITEM.LASTVALUE2}'
              priority: HIGH
              description: 'MX IP address is found in blackhole list. Reason: {ITEM.LASTVALUE3}. Contact DNSBL operator or review mail server configuration.'
              manual_close: 'YES'
              tags:
                - tag: Application
                  value: 'Mail DNS'
                - tag: component
                  value: mail-dns
          master_item:
            key: 'mail.dns.audit[{HOST.HOST},{$DNS_RESOLVER},{$DNS_TIMEOUT_SEC},{$CHECK_IPV6},{$DNSBL_ZONES},{$CIDR_ALLOWLIST},{$SPF_MAX_LOOKUPS},{$SPF_EXPECT_ALL},{$DNSBL_CACHE_TTL_SEC},{$MAX_MX_CHECK},{$DNSBL_MAX_IP},{$DKIM_SELECTORS},{$DNS_SHUFFLE},--dnsbl-test-ip={$DNSBL_TEST_IP}]'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.lld_mx_ip.data
      macros:
        - macro: '{$CHECK_BIMI}'
          value: '1'
          description: 'Set to 0 on hosts without BIMI to suppress BIMI record missing alerts.'
        - macro: '{$CHECK_DMARC_RUA}'
          value: '0'
          description: 'Set to 1 to alert when DMARC record is present but rua= is not configured. Default 0 (off) — rua= is optional per RFC 7489.'
        - macro: '{$CHECK_DNSSEC}'
          value: '1'
          description: 'Set to 0 on hosts without DNSSEC to suppress DNSSEC AD flag and DS record alerts.'
        - macro: '{$CHECK_IPV6}'
          value: '0'
          description: 'Set to 1 to enable IPv6 (AAAA) record checks.'
        - macro: '{$CHECK_MTA_STS}'
          value: '1'
          description: 'Set to 0 on hosts without MTA-STS to suppress MTA-STS record missing alerts.'
        - macro: '{$CHECK_TLS_RPT}'
          value: '1'
          description: 'Set to 0 on hosts without TLS-RPT to suppress TLS-RPT record missing alerts.'
        - macro: '{$CIDR_ALLOWLIST}'
          description: 'Comma-separated list of CIDR networks allowed in SPF records.'
        - macro: '{$DKIM_SELECTORS}'
          value: default
          description: 'DKIM селекторы без ._domainkey, через запятую без пробелов. Примеры: default | default,mail | dkim1,mx'
        - macro: '{$DNSBL_CACHE_TTL_SEC}'
          value: '1200'
          description: 'Time in seconds to cache DNSBL check results locally to respect provider limits.'
        - macro: '{$DNSBL_MAX_IP}'
          value: '1'
          description: 'Maximum number of unique IPs to check against DNSBL zones to avoid rate limiting.'
        - macro: '{$DNSBL_TEST_IP}'
          value: '127.0.0.2'
          description: "Canary address for proving each DNSBL zone is alive. Every working blocklist lists 127.0.0.2 by convention, so a zone that does NOT return it is either emptied (like SORBS after 2024) or refusing our queries - and its 'not listed' verdicts are worthless. Leave empty to switch the self-test off."
        - macro: '{$DNSBL_ZONES}'
          value: 'zen.spamhaus.org,b.barracudacentral.org'
          description: 'Comma-separated list of DNSBL zones to check against.'
        - macro: '{$DNS_RESOLVER}'
          value: ''
          description: 'IP addresses of DNS resolvers, comma-separated. If empty (default), system resolvers from resolv.conf will be used. Examples: 127.0.0.1,9.9.9.10 | 1.1.1.1,8.8.8.8. Previous list for reference: 127.0.0.1,9.9.9.10,149.112.112.10,208.67.222.222,208.67.220.220,8.26.56.26,8.20.247.20,95.85.95.85,2.56.220.2,62.76.76.62,62.76.62.76,195.208.4.1,195.208.5.1. For DNSBL, prefer a local recursive resolver (Unbound/Bind) trusted in your network; public resolvers are often policy-blocked. With multiple resolvers, load is distributed (see {$DNS_SHUFFLE}=1 by default); set {$DNS_SHUFFLE}=0 to keep order.'
        - macro: '{$DNS_SHUFFLE}'
          value: '1'
          description: 'Shuffle resolver list each run to distribute load across resolvers (1=shuffle, 0=keep order from {$DNS_RESOLVER}).'
        - macro: '{$DNS_SLOW_MS}'
          value: '12000'
          description: 'Threshold in milliseconds for triggering slow DNS response alert.'
        - macro: '{$DNS_TIMEOUT_SEC}'
          value: '10'
          description: 'Timeout in seconds for a single DNS query.'
        - macro: '{$MAX_MX_CHECK}'
          value: '5'
          description: 'Maximum number of MX records to process for discovery and detailed checks.'
        - macro: '{$MAIL_CLIENT_AUTOCONFIG_CHECK}'
          value: '1'
          description: 'Set to 0 on hosts that intentionally have no autoconfig/autodiscover DNS records to suppress mail client autoconfiguration alerts.'
        - macro: '{$SPF_CHECK_MX_COVERAGE}'
          value: '1'
          description: 'Set to 1 to alert when MX hosts are not authorized in SPF (default for standalone mail servers). Set to 0 on hosts where MX is intentionally receive-only and does not send outbound mail.'
        - macro: '{$SPF_EXPECT_ALL}'
          value: '-all|~all'
          description: 'Regex for expected "all" mechanism in SPF. Usually "-all" (Fail) or "~all" (SoftFail) is recommended.'
        - macro: '{$SPF_MAX_LOOKUPS}'
          value: '10'
          description: 'Maximum number of DNS lookups allowed for SPF record according to RFC 7208.'
        - macro: '{$TEMPLATE_VERSION}'
          value: 0.1.52
          description: 'Template version identifier for Mail DNS Audit.'
      dashboards:
        - uuid: 1a2b3c4d5e6f4a7b8c9d0e1f2a3b4c5d
          name: 'Mail DNS Audit Overview'
          pages:
            - widgets:
                - type: gauge
                  name: 'DNSBL Health'
                  width: '6'
                  height: '4'
                  fields:
                    - type: STRING
                      name: itemid
                      value: mail.dnsbl.health
                    - type: INTEGER
                      name: max
                      value: '1'
