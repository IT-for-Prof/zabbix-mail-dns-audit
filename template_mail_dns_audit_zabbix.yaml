              delay: '0'
              value_type: UNSIGNED
              description: 'Estimated RSA key size for this selector, 0 when the key could not be read.'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - 'try { var o = typeof value === "string" ? JSON.parse(value) : value; var r = (o && o.dkim && Array.isArray(o.dkim.records)) ? o.dkim.records : []; for (var i=0;i<r.length;i++) { if (r[i] && r[i].selector === "{#DKIM_SELECTOR}") { return r[i].key_bits || 0; } } return 0; } catch (e) { return 0; }'
