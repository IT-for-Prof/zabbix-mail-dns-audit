        - uuid: 1a33a09b887b42c59860eead116a0374
          name: 'DNS lookups that failed this run'
          type: DEPENDENT
          key: mail.dns.lookup_failures
          delay: '0'
          value_type: FLOAT
          description: "How many DNS lookups failed this run (timeout, SERVFAIL) rather than answering 'there is nothing here'. Above zero means the run saw an incomplete picture, so any 'record is missing' verdict from it is unsafe: absence can only be claimed from a complete look. -1 means the running script predates this field, i.e. not measured - deliberately distinct from 0 so the absence guards stay closed rather than opening on an unmeasured run. The 'record missing' triggers require this to be exactly 0."
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.meta.lookup_failures
              error_handler: CUSTOM_VALUE
              error_handler_params: '-1'
          master_item:
            key: 'mail.dns.audit[{HOST.HOST},{$DNS_RESOLVER},{$DNS_TIMEOUT_SEC},{$CHECK_IPV6},{$DNSBL_ZONES},{$CIDR_ALLOWLIST},{$SPF_MAX_LOOKUPS},{$SPF_EXPECT_ALL},{$DNSBL_CACHE_TTL_SEC},{$MAX_MX_CHECK},{$DNSBL_MAX_IP},{$DKIM_SELECTORS},{$DNS_SHUFFLE},--dnsbl-test-ip={$DNSBL_TEST_IP}]'
          tags:
            - tag: Application
              value: 'Mail DNS'
          triggers:
            - uuid: f5d7f88558794b6da084d74f5b3e1dff
              expression: 'min(/Template Mail DNS Audit Zabbix/mail.dns.lookup_failures,#4)>0'
              name: '{HOST.HOST}: DNS failing for 4 consecutive polls — coverage degraded'
              priority: HIGH
              description: 'Every poll for the last four runs lost DNS lookups, so the absence checks have been suppressed that whole time. Nothing is asserting that MX, DKIM, SPF, DMARC or DNSSEC records are present -- their silence means unverified, not healthy. Sustained inability to verify a mail domain is itself an outage of the monitoring, and it must not read as a quiet host. Fix the resolver path from the proxy running this check.'
              dependencies:
                - name: 'DNS audit script error on {HOST.HOST}: {ITEM.LASTVALUE}'
                  expression: 'length(last(/Template Mail DNS Audit Zabbix/mail.dns.error))>0'
                  recovery_expression: ''
              tags:
                - tag: Application
                  value: 'Mail DNS'
                - tag: component
                  value: mail-dns
            - uuid: f1da55fad6eb4de4b81e08dc2c4408bc
              expression: 'min(/Template Mail DNS Audit Zabbix/mail.dns.lookup_failures,#2)>0'
              name: '{HOST.HOST}: DNS lookups failing ({ITEM.LASTVALUE1} this run)'
              priority: WARNING
              description: "DNS lookups are failing (timeout or SERVFAIL) rather than answering. While this is on, the 'record is missing' triggers for this host are deliberately held back, because absence cannot be claimed from an incomplete look - so this alert is also the notice that those checks are currently blind. Look at the resolver the proxy serving this host uses. Requires two consecutive affected polls so a single blip stays quiet."
              dependencies:
                - name: 'DNS audit script error on {HOST.HOST}: {ITEM.LASTVALUE}'
                  expression: 'length(last(/Template Mail DNS Audit Zabbix/mail.dns.error))>0'
                  recovery_expression: ''
              tags:
                - tag: Application
                  value: 'Mail DNS'
                - tag: component
                  value: mail-dns
        - uuid: a9e2999d230c4138a85a8749b1ff386b
          name: 'DNSBL zones failing self-test'
          type: DEPENDENT
          key: mail.dnsbl.canary.failed
          delay: '0'
          value_type: FLOAT
          description: "How many configured DNSBL zones did NOT return the canary address, i.e. cannot prove they still hold data and still answer us. 0 = every zone proved itself. -1 = the self-test is not configured ({$DNSBL_TEST_IP} empty) or the payload was unreadable, which is deliberately distinct from 0 so that 'not measured' never looks like 'fine'."
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  try {
                    var o = JSON.parse(value);
                    var t = (o && o.dnsbl && o.dnsbl.test) ? o.dnsbl.test : null;
                    if (!t || !Array.isArray(t.entries) || t.entries.length === 0) return -1;
                    var bad = 0;
                    for (var i = 0; i < t.entries.length; i++) {
                      if (t.entries[i].status !== 'LISTED') bad++;
                    }
                    return bad;
                  } catch (e) {
                    return -1;
                  }
          master_item:
            key: 'mail.dns.audit[{HOST.HOST},{$DNS_RESOLVER},{$DNS_TIMEOUT_SEC},{$CHECK_IPV6},{$DNSBL_ZONES},{$CIDR_ALLOWLIST},{$SPF_MAX_LOOKUPS},{$SPF_EXPECT_ALL},{$DNSBL_CACHE_TTL_SEC},{$MAX_MX_CHECK},{$DNSBL_MAX_IP},{$DKIM_SELECTORS},{$DNS_SHUFFLE},--dnsbl-test-ip={$DNSBL_TEST_IP}]'
          tags:
            - tag: Application
              value: 'Mail DNS'
          triggers:
            - uuid: 9bc086e655b24abf873e8609a2fb1bcd
              expression: 'min(/Template Mail DNS Audit Zabbix/mail.dnsbl.canary.failed,#2)>0'
              name: '{HOST.HOST}: DNSBL zone cannot prove it is alive ({ITEM.LASTVALUE1} of the configured zones)'
              priority: WARNING
              description: "A working blocklist lists the canary address 127.0.0.2 by convention. A zone that does not return it is either emptied (SORBS was decommissioned in June 2024 and now answers NXDOMAIN to everything) or refusing our queries from this proxy's egress IP. Either way its 'not listed' answers prove nothing, and the DNSBL check for this host is running blind against that zone. Fix: verify with `dig 2.0.0.127.<zone>` from the proxy that serves this host, then either get the querying IP unblocked or remove the zone from {$DNSBL_ZONES}. Requires two consecutive failed polls so a single transient resolver blip does not raise this."
              dependencies:
                - name: 'DNS audit script error on {HOST.HOST}: {ITEM.LASTVALUE}'
                  expression: 'length(last(/Template Mail DNS Audit Zabbix/mail.dns.error))>0'
                  recovery_expression: ''
              tags:
                - tag: Application
                  value: 'Mail DNS'
                - tag: component
                  value: mail-dns
