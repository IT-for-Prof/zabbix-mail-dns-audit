              delay: '0'
              value_type: TEXT
              trends: '0'
              description: 'Serial this nameserver reports for the zone. Diagnostic: when the aggregate mismatch trigger fires, this says which server disagrees.'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - 'try { var o = typeof value === "string" ? JSON.parse(value) : value; var e = (o && o.ns_consistency && Array.isArray(o.ns_consistency.entries)) ? o.ns_consistency.entries : []; for (var i=0;i<e.length;i++) { if (e[i] && e[i].ns === "{#NSHOST}") { return String(e[i].serial || e[i].status || "UNKNOWN"); } } return "UNKNOWN"; } catch (err) { return "UNKNOWN"; }'
