          triggers:
            - uuid: fb2722cc600e41df9157ae06940eeb00
              expression: 'count(/Template Mail DNS Audit Zabbix/mail.script.version,#2,"ne","{$TEMPLATE_VERSION}")=2'
              name: 'Script version mismatch on {HOST.HOST} (running {ITEM.VALUE}, expected {$TEMPLATE_VERSION})'
              priority: WARNING
              description: 'The mail.dns.audit script version has not matched the template version for two consecutive polls. Update the script on the proxy handling this host. Two polls are required because an upgrade is inherently unsynchronised: the template macro changes the instant the template is imported, while the item only learns the new script version at its next poll. A single-sample check therefore raised a false warning on every host at every upgrade. A genuine mismatch -- a proxy that never received the new script -- persists for hours and still alerts.'
