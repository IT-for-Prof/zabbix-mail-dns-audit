zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: a571c0d144b14fd4a87a9d9b2aa9fcd6
      name: Templates/Applications
  templates:
    - uuid: 5f2a484eee7342a7bf440c60fcebca00
      template: 'Template Mail DNS Audit Zabbix'
      name: 'Template Mail DNS Audit Zabbix'
      vendor:
        name: itforprof.com
        version: 0.1.52
      description: |
        Comprehensive Mail DNS Posture Audit.

        Author:  Konstantin Tyutyunnik / Константин Тютюнник
        Site:    https://itforprof.com
        Repo:    https://github.com/IT-for-Prof/zabbix-mail-dns-audit
        License: MIT (c) 2026 Konstantin Tyutyunnik
        
        Monitors:
        - MX records (presence, changes, TTL)
        - SPF (RFC compliance, lookup count, ptr usage, CIDR allowlist)
        - DMARC (presence, policy details: p, rua, sp)
        - DKIM (public key presence and changes)
        - DNSBL (IP listing with normalized statuses: LISTED, POLICY/ERROR, CHECK FAILED)
        - DNSSEC (DS records)
        - NS and SOA records
        - Duplicate DNS records: MX, DMARC, DKIM selectors, NS, SOA
        - Mail client autoconfiguration DNS (autoconfig, autodiscover, SRV)
      groups:
        - name: Templates/Applications
      items:
        - uuid: 449e765e33884e0ea1dd5ff3a0a6d1cc
          name: 'DKIM hash'
          type: DEPENDENT
          key: mail.dkim.hash
          delay: '0'
          value_type: TEXT
          trends: '0'
          description: 'Stable hash of all monitored DKIM selector records.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.snapshots.dkim_hash
          master_item:
            key: 'mail.dns.audit[{HOST.HOST},{$DNS_RESOLVER},{$DNS_TIMEOUT_SEC},{$CHECK_IPV6},{$DNSBL_ZONES},{$CIDR_ALLOWLIST},{$SPF_MAX_LOOKUPS},{$SPF_EXPECT_ALL},{$DNSBL_CACHE_TTL_SEC},{$MAX_MX_CHECK},{$DNSBL_MAX_IP},{$DKIM_SELECTORS},{$DNS_SHUFFLE},--dnsbl-test-ip={$DNSBL_TEST_IP}]'
          tags:
            - tag: Application
              value: 'Mail DNS'
          triggers:
            - uuid: a48aec8440bf4c9ea15aa75a7fd1de4e
              expression: 'length(last(/Template Mail DNS Audit Zabbix/mail.dkim.records.prev))>=0 and length(last(/Template Mail DNS Audit Zabbix/mail.dkim.records))>=0 and last(/Template Mail DNS Audit Zabbix/mail.dkim.hash)<>last(/Template Mail DNS Audit Zabbix/mail.dkim.hash,#2) and length(last(/Template Mail DNS Audit Zabbix/mail.dkim.hash))>0 and length(last(/Template Mail DNS Audit Zabbix/mail.dkim.hash,#2))>0'
              name: '{HOST.HOST}: DKIM record changed'
              opdata: '{ITEM.LASTVALUE1} → {ITEM.LASTVALUE2}'
              priority: WARNING
              description: 'DKIM public key records have changed since the last check. Verify this change was intentional — DKIM key rotation is normal, but unexpected changes may indicate DNS hijacking.'
              dependencies:
                - name: 'DNS audit script error on {HOST.HOST}: {ITEM.LASTVALUE}'
                  expression: 'length(last(/Template Mail DNS Audit Zabbix/mail.dns.error))>0'
                  recovery_expression: ''
              tags:
                - tag: Application
                  value: 'Mail DNS'
                - tag: component
                  value: mail-dns
                - tag: dkim_before
                  value: '{ITEM.LASTVALUE1}'
                - tag: dkim_after
                  value: '{ITEM.LASTVALUE2}'
        - uuid: 32615e5b5e664ed2a8344fe690cdde7f
          name: 'DKIM records summary'
          type: DEPENDENT
          key: mail.dkim.records
          delay: '0'
          value_type: TEXT
          trends: '0'
          description: 'DKIM records formatted as "selector:type-bits" entries (comma-separated). Used to display before/after values when DKIM changes are detected.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.dkim.records
              error_handler: CUSTOM_VALUE
              error_handler_params: '[]'
            - type: JAVASCRIPT
              parameters:
                - 'var r = JSON.parse(value); return r.map(function(d){ return d.selector + ":" + d.k + "-" + (d.key_bits > 0 ? d.key_bits : "unknown"); }).join(", ");'
            - type: DISCARD_UNCHANGED
          master_item:
            key: 'mail.dns.audit[{HOST.HOST},{$DNS_RESOLVER},{$DNS_TIMEOUT_SEC},{$CHECK_IPV6},{$DNSBL_ZONES},{$CIDR_ALLOWLIST},{$SPF_MAX_LOOKUPS},{$SPF_EXPECT_ALL},{$DNSBL_CACHE_TTL_SEC},{$MAX_MX_CHECK},{$DNSBL_MAX_IP},{$DKIM_SELECTORS},{$DNS_SHUFFLE},--dnsbl-test-ip={$DNSBL_TEST_IP}]'
          tags:
            - tag: Application
              value: 'Mail DNS'
        - uuid: 96dd52bf5a38489dae74754f35cb38e5
          name: 'DKIM records summary (previous)'
          type: DEPENDENT
          key: mail.dkim.records.prev
          delay: '0'
          value_type: TEXT
          trends: '0'
          description: 'Previously seen DKIM records ("selector:type-bits", comma-separated), supplied by the script via its cross-run cache. Used to display the "before" value when a DKIM change is detected.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.prev.dkim
              error_handler: CUSTOM_VALUE
              error_handler_params: ''
            - type: DISCARD_UNCHANGED
          master_item:
            key: 'mail.dns.audit[{HOST.HOST},{$DNS_RESOLVER},{$DNS_TIMEOUT_SEC},{$CHECK_IPV6},{$DNSBL_ZONES},{$CIDR_ALLOWLIST},{$SPF_MAX_LOOKUPS},{$SPF_EXPECT_ALL},{$DNSBL_CACHE_TTL_SEC},{$MAX_MX_CHECK},{$DNSBL_MAX_IP},{$DKIM_SELECTORS},{$DNS_SHUFFLE},--dnsbl-test-ip={$DNSBL_TEST_IP}]'
          tags:
            - tag: Application
              value: 'Mail DNS'
        - uuid: 5c65f9a9451a499b974c2303ecc84a76
          name: 'DKIM present'
          type: DEPENDENT
          key: mail.dkim.present
          delay: '0'
          description: '1 = DKIM TXT найден для селекторов в {$DKIM_SELECTORS}, 0 = нет. Пишите селекторы без ._domainkey, через запятую без пробелов (например: default,mail).'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.snapshots.dkim_hash
            - type: JAVASCRIPT
              parameters:
                - 'return (value && value.length > 0) ? 1 : 0;'
          master_item:
            key: 'mail.dns.audit[{HOST.HOST},{$DNS_RESOLVER},{$DNS_TIMEOUT_SEC},{$CHECK_IPV6},{$DNSBL_ZONES},{$CIDR_ALLOWLIST},{$SPF_MAX_LOOKUPS},{$SPF_EXPECT_ALL},{$DNSBL_CACHE_TTL_SEC},{$MAX_MX_CHECK},{$DNSBL_MAX_IP},{$DKIM_SELECTORS},{$DNS_SHUFFLE},--dnsbl-test-ip={$DNSBL_TEST_IP}]'
          tags:
            - tag: Application
              value: 'Mail DNS'
          triggers:
            - uuid: f7ab9358db2b48008a3f2ca96064d55a
              expression: 'last(/Template Mail DNS Audit Zabbix/mail.dkim.present)=0 and last(/Template Mail DNS Audit Zabbix/mail.dns.lookup_failures)=0'
              name: 'DKIM record missing for {HOST.HOST} (selectors: {$DKIM_SELECTORS})'
              priority: HIGH
              description: 'DKIM TXT record not found for selectors specified in {$DKIM_SELECTORS}. Check DNS configuration and selector names.'
              dependencies:
                - name: 'DNS audit script error on {HOST.HOST}: {ITEM.LASTVALUE}'
                  expression: 'length(last(/Template Mail DNS Audit Zabbix/mail.dns.error))>0'
                  recovery_expression: ''
              tags:
                - tag: Application
                  value: 'Mail DNS'
                - tag: component
                  value: mail-dns
        - uuid: 2be6a3208d254d62a890ef207b4177f8
          name: 'DKIM minimum key size'
          type: DEPENDENT
          key: mail.dkim.min_key_bits
          delay: '0'
          description: 'Minimum RSA key size (bits) across all monitored DKIM selectors. 0 = no DKIM found or key could not be parsed. Values: 512, 1024, 2048, 4096.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.dkim.min_key_bits
              error_handler: CUSTOM_VALUE
              error_handler_params: '0'
          master_item:
            key: 'mail.dns.audit[{HOST.HOST},{$DNS_RESOLVER},{$DNS_TIMEOUT_SEC},{$CHECK_IPV6},{$DNSBL_ZONES},{$CIDR_ALLOWLIST},{$SPF_MAX_LOOKUPS},{$SPF_EXPECT_ALL},{$DNSBL_CACHE_TTL_SEC},{$MAX_MX_CHECK},{$DNSBL_MAX_IP},{$DKIM_SELECTORS},{$DNS_SHUFFLE},--dnsbl-test-ip={$DNSBL_TEST_IP}]'
          tags:
            - tag: Application
              value: 'Mail DNS'
          triggers:
            - uuid: 73e69731edd9411197a97e0ce85396e7
              expression: 'last(/Template Mail DNS Audit Zabbix/mail.dkim.min_key_bits)>0 and last(/Template Mail DNS Audit Zabbix/mail.dkim.min_key_bits)<2048 and last(/Template Mail DNS Audit Zabbix/mail.dkim.present)=1'
              name: '{HOST.HOST}: DKIM key too small ({ITEM.LASTVALUE} bits, minimum 2048 required)'
              priority: WARNING
              description: 'One or more DKIM selectors uses an RSA key smaller than 2048 bits. Keys below 2048 bits are considered weak and may be vulnerable to factoring attacks. Fix: generate a new 2048-bit key: openssl genrsa -out dkim_private.key 2048. Publish the new public key in the _domainkey TXT record in DNS and configure your mail server to sign with the new key.'
              dependencies:
                - name: 'DNS audit script error on {HOST.HOST}: {ITEM.LASTVALUE}'
                  expression: 'length(last(/Template Mail DNS Audit Zabbix/mail.dns.error))>0'
                  recovery_expression: ''
                - name: '{HOST.HOST}: DKIM key critically weak ({ITEM.LASTVALUE} bits ≤ 1024, immediate rotation required)'
                  expression: 'last(/Template Mail DNS Audit Zabbix/mail.dkim.min_key_bits)>0 and last(/Template Mail DNS Audit Zabbix/mail.dkim.min_key_bits)<=1024 and last(/Template Mail DNS Audit Zabbix/mail.dkim.present)=1'
                  recovery_expression: ''
              tags:
                - tag: Application
                  value: 'Mail DNS'
                - tag: component
                  value: mail-dns
            - uuid: bddbdf7b57ff4ad99ae87b00462e05b9
              expression: 'last(/Template Mail DNS Audit Zabbix/mail.dkim.min_key_bits)>0 and last(/Template Mail DNS Audit Zabbix/mail.dkim.min_key_bits)<=1024 and last(/Template Mail DNS Audit Zabbix/mail.dkim.present)=1'
              name: '{HOST.HOST}: DKIM key critically weak ({ITEM.LASTVALUE} bits ≤ 1024, immediate rotation required)'
              priority: HIGH
              description: 'A DKIM selector has an RSA key of 1024 bits or less. Such keys can be factored in hours using modern cloud computing. Rotate immediately: generate a new 2048-bit key: openssl genrsa -out dkim_private.key 2048. Publish the new public key in the _domainkey TXT record and update your mail server signing configuration before removing the old key.'
              dependencies:
                - name: 'DNS audit script error on {HOST.HOST}: {ITEM.LASTVALUE}'
                  expression: 'length(last(/Template Mail DNS Audit Zabbix/mail.dns.error))>0'
                  recovery_expression: ''
              tags:
                - tag: Application
                  value: 'Mail DNS'
                - tag: component
                  value: mail-dns
        - uuid: 051a80f792f9484aa56d816a6965c61b
          name: 'DKIM weak key count'
          type: DEPENDENT
          key: mail.dkim.weak_key_count
          delay: '0'
          description: 'Number of monitored DKIM selectors with RSA key size below 2048 bits. See mail.dkim.min_key_bits triggers for alerting.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.dkim.weak_key_count
              error_handler: CUSTOM_VALUE
              error_handler_params: '0'
          master_item:
            key: 'mail.dns.audit[{HOST.HOST},{$DNS_RESOLVER},{$DNS_TIMEOUT_SEC},{$CHECK_IPV6},{$DNSBL_ZONES},{$CIDR_ALLOWLIST},{$SPF_MAX_LOOKUPS},{$SPF_EXPECT_ALL},{$DNSBL_CACHE_TTL_SEC},{$MAX_MX_CHECK},{$DNSBL_MAX_IP},{$DKIM_SELECTORS},{$DNS_SHUFFLE},--dnsbl-test-ip={$DNSBL_TEST_IP}]'
          tags:
            - tag: Application
              value: 'Mail DNS'
        - uuid: d4f97081d844407aac38dafaf393432a
          name: 'DMARC hash'
          type: DEPENDENT
          key: mail.dmarc.hash
          delay: '0'
          value_type: TEXT
          trends: '0'
          description: 'Stable hash of the domain DMARC record.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.snapshots.dmarc_hash
          master_item:
            key: 'mail.dns.audit[{HOST.HOST},{$DNS_RESOLVER},{$DNS_TIMEOUT_SEC},{$CHECK_IPV6},{$DNSBL_ZONES},{$CIDR_ALLOWLIST},{$SPF_MAX_LOOKUPS},{$SPF_EXPECT_ALL},{$DNSBL_CACHE_TTL_SEC},{$MAX_MX_CHECK},{$DNSBL_MAX_IP},{$DKIM_SELECTORS},{$DNS_SHUFFLE},--dnsbl-test-ip={$DNSBL_TEST_IP}]'
          tags:
            - tag: Application
              value: 'Mail DNS'
        - uuid: 4c96f1fb7bf14eeeb5b614bd010856d2
          name: 'DMARC pct'
          type: DEPENDENT
          key: mail.dmarc.pct
          delay: '0'
          description: 'Percentage of messages to which the DMARC policy is applied (pct=). Defaults to 100.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.dmarc.pct
              error_handler: CUSTOM_VALUE
              error_handler_params: '100'
            - type: JAVASCRIPT
              parameters:
                - |
                  var v = parseInt(value);
                  return isNaN(v) ? 100 : v;
          master_item:
            key: 'mail.dns.audit[{HOST.HOST},{$DNS_RESOLVER},{$DNS_TIMEOUT_SEC},{$CHECK_IPV6},{$DNSBL_ZONES},{$CIDR_ALLOWLIST},{$SPF_MAX_LOOKUPS},{$SPF_EXPECT_ALL},{$DNSBL_CACHE_TTL_SEC},{$MAX_MX_CHECK},{$DNSBL_MAX_IP},{$DKIM_SELECTORS},{$DNS_SHUFFLE},--dnsbl-test-ip={$DNSBL_TEST_IP}]'
          tags:
            - tag: Application
              value: 'Mail DNS'
          triggers:
            - uuid: 2f7642a96a2541d5a4a45808e5555555
              expression: 'last(/Template Mail DNS Audit Zabbix/mail.dmarc.pct)<100'
              name: 'DMARC pct below 100 ({ITEM.LASTVALUE}%) for {HOST.HOST}'
              priority: INFO
              description: 'DMARC policy is applied to only {ITEM.LASTVALUE}% of messages. Recommended: set pct=100 for full protection.'
              dependencies:
                - name: 'DNS audit script error on {HOST.HOST}: {ITEM.LASTVALUE}'
                  expression: 'length(last(/Template Mail DNS Audit Zabbix/mail.dns.error))>0'
                  recovery_expression: ''
              tags:
                - tag: Application
                  value: 'Mail DNS'
                - tag: component
                  value: mail-dns
        - uuid: e79cdc39f6494441a2126cfe324e7346
          name: 'DMARC policy'
          type: DEPENDENT
          key: mail.dmarc.policy
          delay: '0'
          value_type: TEXT
          trends: '0'
          description: 'The effective DMARC policy (p=) which can be "none", "quarantine", or "reject".'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.dmarc.p
            - type: JAVASCRIPT
              parameters:
                - 'return (["none", "quarantine", "reject"].indexOf(value) !== -1) ? value : "none";'
          master_item:
            key: 'mail.dns.audit[{HOST.HOST},{$DNS_RESOLVER},{$DNS_TIMEOUT_SEC},{$CHECK_IPV6},{$DNSBL_ZONES},{$CIDR_ALLOWLIST},{$SPF_MAX_LOOKUPS},{$SPF_EXPECT_ALL},{$DNSBL_CACHE_TTL_SEC},{$MAX_MX_CHECK},{$DNSBL_MAX_IP},{$DKIM_SELECTORS},{$DNS_SHUFFLE},--dnsbl-test-ip={$DNSBL_TEST_IP}]'
          tags:
            - tag: Application
              value: 'Mail DNS'
          triggers:
            - uuid: f6e7af347b614fdd8c919123d4444444
              expression: 'last(/Template Mail DNS Audit Zabbix/mail.dmarc.present)=1 and last(/Template Mail DNS Audit Zabbix/mail.dmarc.policy)="none"'
              name: 'DMARC policy is none for {HOST.HOST}'
              priority: WARNING
              description: 'DMARC policy is set to p=none. Recommended: upgrade to p=quarantine or p=reject for better protection.'
              dependencies:
                - name: 'DNS audit script error on {HOST.HOST}: {ITEM.LASTVALUE}'
                  expression: 'length(last(/Template Mail DNS Audit Zabbix/mail.dns.error))>0'
                  recovery_expression: ''
              tags:
                - tag: Application
                  value: 'Mail DNS'
                - tag: component
                  value: mail-dns
            - uuid: fe7655707cb74c8cbee9b1c8acafdbc4
              expression: 'length(last(/Template Mail DNS Audit Zabbix/mail.dmarc.policy.prev))>=0 and last(/Template Mail DNS Audit Zabbix/mail.dmarc.present)=1 and last(/Template Mail DNS Audit Zabbix/mail.dmarc.policy)="none" and (last(/Template Mail DNS Audit Zabbix/mail.dmarc.policy,#2)="quarantine" or last(/Template Mail DNS Audit Zabbix/mail.dmarc.policy,#2)="reject")'
              name: 'DMARC policy downgraded to none for {HOST.HOST} (was {ITEM.LASTVALUE1})'
              opdata: '{ITEM.LASTVALUE1} → none'
              priority: HIGH
              description: 'DMARC policy was downgraded from {ITEM.LASTVALUE1} to none. This is a security regression — messages will no longer be quarantined or rejected. Restore p=quarantine or p=reject immediately.'
              dependencies:
                - name: 'DNS audit script error on {HOST.HOST}: {ITEM.LASTVALUE}'
                  expression: 'length(last(/Template Mail DNS Audit Zabbix/mail.dns.error))>0'
                  recovery_expression: ''
              tags:
                - tag: Application
                  value: 'Mail DNS'
                - tag: component
                  value: mail-dns
                - tag: dmarc_before
                  value: '{ITEM.LASTVALUE1}'
                - tag: dmarc_after
                  value: none
        - uuid: bd2fb418af02415cb16695a24525e69d
          name: 'DMARC policy (previous)'
          type: DEPENDENT
          key: mail.dmarc.policy.prev
          delay: '0'
          value_type: TEXT
          trends: '0'
          description: 'Previously seen DMARC policy (p=), supplied by the script via its cross-run cache. Used to display the "before" value when a DMARC policy downgrade is detected.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.prev.dmarc
              error_handler: CUSTOM_VALUE
              error_handler_params: ''
            - type: JAVASCRIPT
              parameters:
                - 'return (["none", "quarantine", "reject"].indexOf(value) !== -1) ? value : "none";'
            - type: DISCARD_UNCHANGED
          master_item:
            key: 'mail.dns.audit[{HOST.HOST},{$DNS_RESOLVER},{$DNS_TIMEOUT_SEC},{$CHECK_IPV6},{$DNSBL_ZONES},{$CIDR_ALLOWLIST},{$SPF_MAX_LOOKUPS},{$SPF_EXPECT_ALL},{$DNSBL_CACHE_TTL_SEC},{$MAX_MX_CHECK},{$DNSBL_MAX_IP},{$DKIM_SELECTORS},{$DNS_SHUFFLE},--dnsbl-test-ip={$DNSBL_TEST_IP}]'
          tags:
            - tag: Application
              value: 'Mail DNS'
        - uuid: 5fd95e5b13494827ba65a565950203e7
          name: 'DMARC present'
          type: DEPENDENT
          key: mail.dmarc.present
          delay: '0'
          description: 'Flag indicating if a DMARC record is present (1 = Yes, 0 = No).'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.dmarc.present
            - type: BOOL_TO_DECIMAL
              parameters:
                - ''
          master_item:
            key: 'mail.dns.audit[{HOST.HOST},{$DNS_RESOLVER},{$DNS_TIMEOUT_SEC},{$CHECK_IPV6},{$DNSBL_ZONES},{$CIDR_ALLOWLIST},{$SPF_MAX_LOOKUPS},{$SPF_EXPECT_ALL},{$DNSBL_CACHE_TTL_SEC},{$MAX_MX_CHECK},{$DNSBL_MAX_IP},{$DKIM_SELECTORS},{$DNS_SHUFFLE},--dnsbl-test-ip={$DNSBL_TEST_IP}]'
          tags:
            - tag: Application
              value: 'Mail DNS'
        - uuid: 5fb694a5d78e4e1880b4c2c2f7c7903d
          name: 'DMARC rua'
          type: DEPENDENT
          key: mail.dmarc.rua
          delay: '0'
          value_type: TEXT
          trends: '0'
          description: 'The aggregate reporting URI (rua=) specified in the DMARC record.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.dmarc.rua
              error_handler: CUSTOM_VALUE
              error_handler_params: ''
          master_item:
            key: 'mail.dns.audit[{HOST.HOST},{$DNS_RESOLVER},{$DNS_TIMEOUT_SEC},{$CHECK_IPV6},{$DNSBL_ZONES},{$CIDR_ALLOWLIST},{$SPF_MAX_LOOKUPS},{$SPF_EXPECT_ALL},{$DNSBL_CACHE_TTL_SEC},{$MAX_MX_CHECK},{$DNSBL_MAX_IP},{$DKIM_SELECTORS},{$DNS_SHUFFLE},--dnsbl-test-ip={$DNSBL_TEST_IP}]'
          tags:
            - tag: Application
              value: 'Mail DNS'
          triggers:
            - uuid: ed9eed8da1b949a5a59565cb4325528b
              expression: 'last(/Template Mail DNS Audit Zabbix/mail.dmarc.present)=1 and (length(last(/Template Mail DNS Audit Zabbix/mail.dmarc.rua))=0 or last(/Template Mail DNS Audit Zabbix/mail.dmarc.rua)="null") and {$CHECK_DMARC_RUA}=1'
              name: '{HOST.HOST}: DMARC rua= not configured (no aggregate reports)'
              priority: INFO
              description: 'DMARC record is present but has no rua= tag. Without rua=, you receive no aggregate reports about SPF/DKIM authentication results for your domain. To suppress, set {$CHECK_DMARC_RUA}=0 on this host (default). To mandate reporting, set {$CHECK_DMARC_RUA}=1 and add rua=mailto:dmarc@yourdomain.com or use a DMARC reporting service.'
              dependencies:
                - name: 'DNS audit script error on {HOST.HOST}: {ITEM.LASTVALUE}'
                  expression: 'length(last(/Template Mail DNS Audit Zabbix/mail.dns.error))>0'
                  recovery_expression: ''
              tags:
                - tag: Application
                  value: 'Mail DNS'
                - tag: component
                  value: mail-dns
            - uuid: b0319c87bc424da4b9a0210b7067a5d7
              expression: 'last(/Template Mail DNS Audit Zabbix/mail.dmarc.present)=1 and length(last(/Template Mail DNS Audit Zabbix/mail.dmarc.rua))>0 and last(/Template Mail DNS Audit Zabbix/mail.dmarc.rua)<>"null" and find(/Template Mail DNS Audit Zabbix/mail.dmarc.rua,#1,"iregexp","^mailto:")=0'
              name: '{HOST.HOST}: DMARC rua= malformed ({ITEM.LASTVALUE2}) — must use mailto: scheme'
              priority: WARNING
              description: 'DMARC rua= is set but does not start with mailto: (e.g. "dmarc@example.com" instead of "mailto:dmarc@example.com"). DMARC aggregate report URIs must use the mailto: scheme per RFC 7489. Fix the DMARC TXT record.'
              dependencies:
                - name: 'DNS audit script error on {HOST.HOST}: {ITEM.LASTVALUE}'
                  expression: 'length(last(/Template Mail DNS Audit Zabbix/mail.dns.error))>0'
                  recovery_expression: ''
              tags:
                - tag: Application
                  value: 'Mail DNS'
                - tag: component
                  value: mail-dns
        - uuid: 763f4b6b1ce24cf1b5e75d2d26fde812
          name: 'DMARC DKIM alignment mode'
          type: DEPENDENT
          key: mail.dmarc.adkim
          delay: '0'
          value_type: TEXT
          trends: '0'
          description: 'DKIM alignment mode (adkim=): "r" = relaxed (default per RFC 7489, subdomains pass), "s" = strict (exact From: domain match required). Absent tag means relaxed.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.dmarc.adkim
              error_handler: CUSTOM_VALUE
              error_handler_params: 'r'
            - type: JAVASCRIPT
              parameters:
                - 'return value === "null" ? "r" : value;'
          master_item:
            key: 'mail.dns.audit[{HOST.HOST},{$DNS_RESOLVER},{$DNS_TIMEOUT_SEC},{$CHECK_IPV6},{$DNSBL_ZONES},{$CIDR_ALLOWLIST},{$SPF_MAX_LOOKUPS},{$SPF_EXPECT_ALL},{$DNSBL_CACHE_TTL_SEC},{$MAX_MX_CHECK},{$DNSBL_MAX_IP},{$DKIM_SELECTORS},{$DNS_SHUFFLE},--dnsbl-test-ip={$DNSBL_TEST_IP}]'
          tags:
            - tag: Application
              value: 'Mail DNS'
        - uuid: 773ba922f530488caf6238be3cb55289
          name: 'DMARC SPF alignment mode'
          type: DEPENDENT
          key: mail.dmarc.aspf
          delay: '0'
          value_type: TEXT
          trends: '0'
