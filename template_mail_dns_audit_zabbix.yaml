              description: 'This MX target is an alias. RFC 5321 section 5.1 requires an MX to name a host with address records directly. Some senders refuse to follow the alias and the domain silently loses mail from them. The aggregate count has been alerted on for a while; this names the offending host.'
              dependencies:
