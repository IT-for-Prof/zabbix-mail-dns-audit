              priority: HIGH
              description: 'The domain publishes a null MX (RFC 7505 section 3), which tells every sender on the Internet to stop trying: mail to this domain is rejected outright, permanently. On a host monitored as a mail server this is an outage, not a note. RFC 7505 is used here only to name the cause precisely instead of reporting the misleading No MX records found. If the domain genuinely must not receive mail, take it off this template rather than lowering the severity.'
