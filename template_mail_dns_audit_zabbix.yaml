    - uuid: 8a7b6c5d4e3f4a2b8c1d0e9f8a7b6c5d
      name: 'SPF Health Status'
      key: mail.spf.health
      type: DEPENDENT
      master_item:
        key: 'mail.dns.audit[{HOST.NAME},{$DNS_RESOLVER},{$DNS_TIMEOUT_SEC},{$CHECK_IPV6},{$DNSBL_ZONES},{$CIDR_ALLOWLIST},{$SPF_MAX_LOOKUPS},{$SPF_EXPECT_ALL},{$DNSBL_CACHE_TTL_SEC},{$MAX_MX_CHECK},{$DNSBL_MAX_IP},{$DKIM_SELECTORS},{$DNS_SHUFFLE}]'
      value_type: UNSIGNED
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |
          try {
            var obj = JSON.parse(value);
            var sa = obj.spf_analysis;
            if (sa.all_policy_ok && 
                sa.lookup_estimate <= 10 && 
                !sa.has_multiple_spf && 
                !sa.has_ptr) {
              return 1;
            }
            return 0;
          } catch (e) { return 0; }
      description: 'Overall SPF health status: 1 (OK), 0 (Issues detected).'
      tags:
      - tag: Application
        value: Mail DNS
    - uuid: 7f6e5d4c3b2a4f1e8d0c9b8a7b6c5d4e
      name: 'DNSBL Health Status'
      key: mail.dnsbl.health
      type: DEPENDENT
      master_item:
        key: 'mail.dns.audit[{HOST.NAME},{$DNS_RESOLVER},{$DNS_TIMEOUT_SEC},{$CHECK_IPV6},{$DNSBL_ZONES},{$CIDR_ALLOWLIST},{$SPF_MAX_LOOKUPS},{$SPF_EXPECT_ALL},{$DNSBL_CACHE_TTL_SEC},{$MAX_MX_CHECK},{$DNSBL_MAX_IP},{$DKIM_SELECTORS},{$DNS_SHUFFLE}]'
      value_type: UNSIGNED
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |
          try {
            var obj = JSON.parse(value);
            var entries = (obj && obj.dnsbl && Array.isArray(obj.dnsbl.entries)) ? obj.dnsbl.entries : [];
            if (!entries.length) return 1;
            for (var i=0;i<entries.length;i++) {
              var st = entries[i].status;
              if (st && st !== "NOT LISTED") {
                return 0;
              }
            }
            return 1;
          } catch (e) { return 0; }
      description: 'Overall DNSBL status: 1 (all checks NOT LISTED), 0 (listed, policy/error, or check failures present).'
      tags:
      - tag: Application
        value: Mail DNS
