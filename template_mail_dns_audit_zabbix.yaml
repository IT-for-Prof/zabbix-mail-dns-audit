                  value: 'Mail DNS'
            - uuid: c79957e5ec6849b79f9e2c7831a977e8
              name: 'MX host TTL [{#MXHOST}]'
              type: DEPENDENT
              key: 'mail.mx.host.ttl[{#MXHOST}]'
              delay: '0'
              units: s
              description: 'Time-to-Live (TTL) value for the MX host {#MXHOST}.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.mx[?(@.host=="{#MXHOST}")].ttl'
                - type: JAVASCRIPT
                  parameters:
                    - |
                      try {
                        var v = JSON.parse(value);
                        if (Array.isArray(v) && v.length > 0) return v[0];
                        return v;
                      } catch (e) { return 0; }
              master_item:
                key: 'mail.dns.audit[{HOST.HOST},{$DNS_RESOLVER},{$DNS_TIMEOUT_SEC},{$CHECK_IPV6},{$DNSBL_ZONES},{$CIDR_ALLOWLIST},{$SPF_MAX_LOOKUPS},{$SPF_EXPECT_ALL},{$DNSBL_CACHE_TTL_SEC},{$MAX_MX_CHECK},{$DNSBL_MAX_IP},{$DKIM_SELECTORS},{$DNS_SHUFFLE},--dnsbl-test-ip={$DNSBL_TEST_IP}]'
              tags:
                - tag: Application
                  value: 'Mail DNS'
          master_item:
            key: 'mail.dns.audit[{HOST.HOST},{$DNS_RESOLVER},{$DNS_TIMEOUT_SEC},{$CHECK_IPV6},{$DNSBL_ZONES},{$CIDR_ALLOWLIST},{$SPF_MAX_LOOKUPS},{$SPF_EXPECT_ALL},{$DNSBL_CACHE_TTL_SEC},{$MAX_MX_CHECK},{$DNSBL_MAX_IP},{$DKIM_SELECTORS},{$DNS_SHUFFLE},--dnsbl-test-ip={$DNSBL_TEST_IP}]'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.lld_mx.data
          trigger_prototypes:
            - uuid: 75d2244788c24105a5347edf15082419
              expression: 'length(last(/Template Mail DNS Audit Zabbix/mail.mx.host.cname[{#MXHOST}]))>0 and last(/Template Mail DNS Audit Zabbix/mail.mx.host.cname[{#MXHOST}])<>"*NONE*"'
              name: '{HOST.HOST}: MX {#MXHOST} is a CNAME to {ITEM.LASTVALUE1} — RFC 5321 violation'
