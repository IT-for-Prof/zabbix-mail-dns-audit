              expression: 'nodata(/Template Mail DNS Audit Zabbix/mail.dns.query_time_ms,{$MAIL_DNS_NODATA_SEC})=1'
              name: 'DNS audit script not running on {HOST.HOST} (no data for {$MAIL_DNS_NODATA_SEC})'
              priority: HIGH
              description: 'The mail.dns.audit external script has not produced results within {$MAIL_DNS_NODATA_SEC}. Check that the script exists at the external scripts path, is executable, that dnspython is installed, and that the proxy running the check can execute it. This trigger watches query_time_ms rather than the master item on purpose: an error envelope still carries that field, so "not running at all" stays distinguishable from "running and failing", which the DNS audit script error trigger covers. The nodata() call deliberately omits the "strict" parameter — the check executes on a proxy, and the default behaviour suppresses a false alarm right after the proxy reconnects.'
              tags:
