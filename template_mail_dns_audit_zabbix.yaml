                  expression: 'length(last(/Template Mail DNS Audit Zabbix/mail.dns.error))>0'
                  recovery_expression: ''
              tags:
                - tag: Application
                  value: 'Mail DNS'
                - tag: component
                  value: mail-dns
        - uuid: 47003523826443cd8fad42efbda55c6e
          name: 'MX IP discovery'
          type: DEPENDENT
          key: mail.mx.ip.discovery
          delay: '0'
          description: 'Discovers individual IP addresses associated with MX hosts for DNSBL checking.'
          item_prototypes:
            - uuid: d2ec2acafd0b4fcaab264b06d7c186f7
              name: 'PTR status for {#MXIP}'
              type: DEPENDENT
              key: 'mail.ptr.status[{#MXIP}]'
              delay: '0'
              value_type: TEXT
              trends: '0'
              description: 'PTR/FCrDNS verdict for this address. OK, MISSING, NO_FCRDNS, GENERIC, ERROR, or SKIP_IPV6. Every discovered IPv4 address is checked; {$DNSBL_MAX_IP} caps only the blocklist queries.'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      try {
                        var o = typeof value === "string" ? JSON.parse(value) : value;
                        var e = (o && o.ptr && Array.isArray(o.ptr.entries)) ? o.ptr.entries : [];
                        for (var i=0;i<e.length;i++) { if (e[i] && e[i].ip === "{#MXIP}") { return e[i].status || "UNKNOWN"; } }
                        return "UNKNOWN";
                      } catch (err) { return "UNKNOWN"; }

              master_item:
                key: 'mail.dns.audit[{HOST.HOST},{$DNS_RESOLVER},{$DNS_TIMEOUT_SEC},{$CHECK_IPV6},{$DNSBL_ZONES},{$CIDR_ALLOWLIST},{$SPF_MAX_LOOKUPS},{$SPF_EXPECT_ALL},{$DNSBL_CACHE_TTL_SEC},{$MAX_MX_CHECK},{$DNSBL_MAX_IP},{$DKIM_SELECTORS},{$DNS_SHUFFLE},--dnsbl-test-ip={$DNSBL_TEST_IP}]'
              tags:
                - tag: Application
                  value: 'Mail DNS'
            - uuid: 0a5f5609247d4a21a7d3e207328788c6
              name: 'PTR hostname for {#MXIP}'
              type: DEPENDENT
              key: 'mail.ptr.host[{#MXIP}]'
              delay: '0'
              value_type: TEXT
              trends: '0'
              description: 'The name this address resolves back to, or *NONE* when there is none.'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      try {
                        var o = typeof value === "string" ? JSON.parse(value) : value;
                        var e = (o && o.ptr && Array.isArray(o.ptr.entries)) ? o.ptr.entries : [];
                        for (var i=0;i<e.length;i++) { if (e[i] && e[i].ip === "{#MXIP}") { return e[i].ptr || "*NONE*"; } }
                        return "*NONE*";
                      } catch (err) { return "*NONE*"; }

              master_item:
                key: 'mail.dns.audit[{HOST.HOST},{$DNS_RESOLVER},{$DNS_TIMEOUT_SEC},{$CHECK_IPV6},{$DNSBL_ZONES},{$CIDR_ALLOWLIST},{$SPF_MAX_LOOKUPS},{$SPF_EXPECT_ALL},{$DNSBL_CACHE_TTL_SEC},{$MAX_MX_CHECK},{$DNSBL_MAX_IP},{$DKIM_SELECTORS},{$DNS_SHUFFLE},--dnsbl-test-ip={$DNSBL_TEST_IP}]'
              tags:
                - tag: Application
                  value: 'Mail DNS'
            - uuid: 5c0e0a544e6b4c74954b0f12abf7e5d4
              name: 'MX IP listed status [{#MXIP}]'
              type: DEPENDENT
              key: 'mail.mx.ip.listed.status[{#MXIP}]'
              delay: '0'
              value_type: TEXT
              trends: '0'
              description: 'Normalized DNSBL check status for IP {#MXIP}: LISTED, NOT LISTED, POLICY/ERROR, or CHECK FAILED.'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      try {
                        var obj = typeof value === 'string' ? JSON.parse(value) : value;
                        var entries = (obj && obj.dnsbl && Array.isArray(obj.dnsbl.entries)) ? obj.dnsbl.entries : [];
                        var statuses = [];
                        for (var i=0;i<entries.length;i++) {
                          var e = entries[i];
                          if (e && e.ip === "{#MXIP}") {
                            if (e.status) { statuses.push(e.status); }
                          }
                        }
                        if (statuses.indexOf("LISTED") !== -1) return "LISTED";
                        if (statuses.indexOf("POLICY/ERROR") !== -1) return "POLICY/ERROR";
                        if (statuses.indexOf("CHECK FAILED") !== -1) return "CHECK FAILED";
                        if (statuses.length === 0) {
                        var chk = (obj && obj.dnsbl && Array.isArray(obj.dnsbl.checked_ips)) ? obj.dnsbl.checked_ips : [];
                        return chk.indexOf("{#MXIP}") === -1 ? "NOT_CHECKED" : "NOT LISTED";
                        }
                        return statuses[0];
                      } catch (e) {
                        return "UNKNOWN";
                      }
              master_item:
                key: 'mail.dns.audit[{HOST.HOST},{$DNS_RESOLVER},{$DNS_TIMEOUT_SEC},{$CHECK_IPV6},{$DNSBL_ZONES},{$CIDR_ALLOWLIST},{$SPF_MAX_LOOKUPS},{$SPF_EXPECT_ALL},{$DNSBL_CACHE_TTL_SEC},{$MAX_MX_CHECK},{$DNSBL_MAX_IP},{$DKIM_SELECTORS},{$DNS_SHUFFLE},--dnsbl-test-ip={$DNSBL_TEST_IP}]'
              tags:
                - tag: Application
                  value: 'Mail DNS'
            - uuid: 7f7ff6283d184a699b604e6a46c5a1cb
              name: 'MX IP listed TXT [{#MXIP}]'
              type: DEPENDENT
              key: 'mail.mx.ip.listed.txt[{#MXIP}]'
              delay: '0'
              value_type: TEXT
              trends: '0'
              description: 'Detailed TXT explanation from the DNSBL provider for IP {#MXIP}.'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      try {
                        var obj = typeof value === 'string' ? JSON.parse(value) : value;
                        var entries = (obj && obj.dnsbl && Array.isArray(obj.dnsbl.entries)) ? obj.dnsbl.entries : [];
                        var txts = [];
                        for (var i=0;i<entries.length;i++) {
                          var e = entries[i];
                          if (e && e.ip === "{#MXIP}" && Array.isArray(e.txt)) {
                            txts = txts.concat(e.txt);
                          }
                        }
                        return txts.length ? txts.join("; ") : "*NONE*";
                      } catch (e) {
                        return "*NONE*";
                      }
              master_item:
                key: 'mail.dns.audit[{HOST.HOST},{$DNS_RESOLVER},{$DNS_TIMEOUT_SEC},{$CHECK_IPV6},{$DNSBL_ZONES},{$CIDR_ALLOWLIST},{$SPF_MAX_LOOKUPS},{$SPF_EXPECT_ALL},{$DNSBL_CACHE_TTL_SEC},{$MAX_MX_CHECK},{$DNSBL_MAX_IP},{$DKIM_SELECTORS},{$DNS_SHUFFLE},--dnsbl-test-ip={$DNSBL_TEST_IP}]'
              tags:
                - tag: Application
                  value: 'Mail DNS'
            - uuid: 4f7bb0d6b7d048d6a3a4c7b09239a322
              name: 'MX IP listed zone [{#MXIP}]'
              type: DEPENDENT
              key: 'mail.mx.ip.listed.zone[{#MXIP}]'
              delay: '0'
              value_type: TEXT
              trends: '0'
              description: 'The name of the DNSBL zone where the IP {#MXIP} was found.'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      try {
                        var obj = typeof value === 'string' ? JSON.parse(value) : value;
                        if (obj && obj.dnsbl && Array.isArray(obj.dnsbl.listed)) {
                          for (var i=0;i<obj.dnsbl.listed.length;i++) {
                            if (obj.dnsbl.listed[i].ip === "{#MXIP}") {
                              var z = obj.dnsbl.listed[i].zone;
                              if (z && z !== '') { return z; }
                            }
                          }
                        }
                      } catch(e) {}
                      return '*UNKNOWN*';
              master_item:
                key: 'mail.dns.audit[{HOST.HOST},{$DNS_RESOLVER},{$DNS_TIMEOUT_SEC},{$CHECK_IPV6},{$DNSBL_ZONES},{$CIDR_ALLOWLIST},{$SPF_MAX_LOOKUPS},{$SPF_EXPECT_ALL},{$DNSBL_CACHE_TTL_SEC},{$MAX_MX_CHECK},{$DNSBL_MAX_IP},{$DKIM_SELECTORS},{$DNS_SHUFFLE},--dnsbl-test-ip={$DNSBL_TEST_IP}]'
              tags:
                - tag: Application
                  value: 'Mail DNS'
            - uuid: 17cdad41489b47c2b649b79a1478d79b
              name: 'MX IP listed flag [{#MXIP}]'
              type: DEPENDENT
              key: 'mail.mx.ip.listed[{#MXIP}]'
              delay: '0'
              description: 'Blocklist verdict for {#MXIP}: 1 listed, 0 checked and clean, 2 never checked because {$DNSBL_MAX_IP} stopped short. Two earlier defects are fixed here. The JSONPath filter discarded the value when the address was absent from the listed array, so a delisted address kept its old 1 and the alert never cleared. And an address past the limit was indistinguishable from a clean one, so it read as verified when nothing had queried it.'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      try {
                        var o = typeof value === 'string' ? JSON.parse(value) : value;
                        var d = (o && o.dnsbl) ? o.dnsbl : {};
                        var chk = Array.isArray(d.checked_ips) ? d.checked_ips : [];
                        if (chk.indexOf("{#MXIP}") === -1) { return 2; }
                        var lst = Array.isArray(d.listed) ? d.listed : [];
                        for (var i=0;i<lst.length;i++) {
                          if (lst[i] && lst[i].ip === "{#MXIP}") { return 1; }
                        }
                        return 0;
                      } catch (e) { return 2; }
              master_item:
                key: 'mail.dns.audit[{HOST.HOST},{$DNS_RESOLVER},{$DNS_TIMEOUT_SEC},{$CHECK_IPV6},{$DNSBL_ZONES},{$CIDR_ALLOWLIST},{$SPF_MAX_LOOKUPS},{$SPF_EXPECT_ALL},{$DNSBL_CACHE_TTL_SEC},{$MAX_MX_CHECK},{$DNSBL_MAX_IP},{$DKIM_SELECTORS},{$DNS_SHUFFLE},--dnsbl-test-ip={$DNSBL_TEST_IP}]'
              tags:
                - tag: Application
                  value: 'Mail DNS'
          trigger_prototypes:
            - uuid: 2ad0d59178f84e00aaf9911a25c8d33c
              expression: 'count(/Template Mail DNS Audit Zabbix/mail.ptr.status[{#MXIP}],#2,"eq","MISSING")=2'
              name: '{HOST.HOST}: MX {#MXHOST} address {#MXIP} has no PTR record'
              priority: AVERAGE
              description: 'This address has no reverse record. Receiving mail servers commonly reject or greylist senders without one. Requires two consecutive polls and a run that lost no lookups, so a transient DNS failure cannot claim absence.'
              dependencies:
                - name: 'DNS audit script error on {HOST.HOST}: {ITEM.LASTVALUE}'
                  expression: 'length(last(/Template Mail DNS Audit Zabbix/mail.dns.error))>0'
                  recovery_expression: ''
              tags:
                - tag: Application
                  value: 'Mail DNS'
                - tag: component
                  value: mail-dns
            - uuid: 9a27146b2e5c4f09a5326654716f13d6
              expression: 'count(/Template Mail DNS Audit Zabbix/mail.ptr.status[{#MXIP}],#2,"eq","NO_FCRDNS")=2 and length(last(/Template Mail DNS Audit Zabbix/mail.ptr.host[{#MXIP}]))>=0'
              name: '{HOST.HOST}: MX {#MXHOST} address {#MXIP} fails FCrDNS (PTR points at {ITEM.LASTVALUE2})'
              priority: AVERAGE
              description: 'The reverse record exists but its forward lookup does not come back to this address. Forward-confirmed reverse DNS is a standard sender check; failing it costs deliverability.'
              dependencies:
                - name: 'DNS audit script error on {HOST.HOST}: {ITEM.LASTVALUE}'
                  expression: 'length(last(/Template Mail DNS Audit Zabbix/mail.dns.error))>0'
                  recovery_expression: ''
              tags:
                - tag: Application
                  value: 'Mail DNS'
                - tag: component
                  value: mail-dns
            - uuid: 9f3fd9925f1e4b4f81ce3f3c8cfa9a90
              expression: 'last(/Template Mail DNS Audit Zabbix/mail.mx.ip.listed.status[{#MXIP}])="CHECK FAILED" and length(last(/Template Mail DNS Audit Zabbix/mail.mx.ip.listed.txt[{#MXIP}]))>=0'
              name: '{HOST.HOST}: MX {#MXHOST} IP {#MXIP} DNSBL check failed: {ITEM.LASTVALUE2}'
              priority: WARNING
              description: 'Technical failure during DNSBL check. Error: {ITEM.LASTVALUE2}'
              manual_close: 'YES'
              dependencies:
                - name: 'DNS audit script error on {HOST.HOST}: {ITEM.LASTVALUE}'
                  expression: 'length(last(/Template Mail DNS Audit Zabbix/mail.dns.error))>0'
                  recovery_expression: ''
              tags:
                - tag: Application
                  value: 'Mail DNS'
                - tag: component
                  value: mail-dns
            - uuid: 0a2c5e1a0a434f7e9f6a55bfe0ec74d1
              expression: 'last(/Template Mail DNS Audit Zabbix/mail.mx.ip.listed.status[{#MXIP}])="POLICY/ERROR" and length(last(/Template Mail DNS Audit Zabbix/mail.mx.ip.listed.txt[{#MXIP}]))>=0'
              name: '{HOST.HOST}: MX {#MXHOST} IP {#MXIP} DNSBL policy/error: {ITEM.LASTVALUE2}'
              priority: WARNING
              description: 'DNSBL provider blocks queries: {ITEM.LASTVALUE2}. Reason: Rate limit or open resolver policy.'
              manual_close: 'YES'
              dependencies:
                - name: 'DNS audit script error on {HOST.HOST}: {ITEM.LASTVALUE}'
                  expression: 'length(last(/Template Mail DNS Audit Zabbix/mail.dns.error))>0'
                  recovery_expression: ''
              tags:
                - tag: Application
                  value: 'Mail DNS'
                - tag: component
                  value: mail-dns
            - uuid: 6e43d4d3f8f44f1ea4e7fd5fce6cb9e4
              expression: 'last(/Template Mail DNS Audit Zabbix/mail.mx.ip.listed[{#MXIP}])=1 and last(/Template Mail DNS Audit Zabbix/mail.mx.ip.listed.zone[{#MXIP}])<>"*UNKNOWN*" and length(last(/Template Mail DNS Audit Zabbix/mail.mx.ip.listed.txt[{#MXIP}]))>=0'
              name: '{HOST.HOST}: MX {#MXHOST} IP {#MXIP} listed in DNSBL {ITEM.LASTVALUE2}'
              priority: HIGH
              description: 'MX IP address is found in blackhole list. Reason: {ITEM.LASTVALUE3}. Contact DNSBL operator or review mail server configuration.'
              manual_close: 'YES'
              dependencies:
                - name: 'DNS audit script error on {HOST.HOST}: {ITEM.LASTVALUE}'
                  expression: 'length(last(/Template Mail DNS Audit Zabbix/mail.dns.error))>0'
                  recovery_expression: ''
              tags:
                - tag: Application
                  value: 'Mail DNS'
                - tag: component
                  value: mail-dns
          master_item:
            key: 'mail.dns.audit[{HOST.HOST},{$DNS_RESOLVER},{$DNS_TIMEOUT_SEC},{$CHECK_IPV6},{$DNSBL_ZONES},{$CIDR_ALLOWLIST},{$SPF_MAX_LOOKUPS},{$SPF_EXPECT_ALL},{$DNSBL_CACHE_TTL_SEC},{$MAX_MX_CHECK},{$DNSBL_MAX_IP},{$DKIM_SELECTORS},{$DNS_SHUFFLE},--dnsbl-test-ip={$DNSBL_TEST_IP}]'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.lld_mx_ip.data
      macros:
        - macro: '{$CHECK_BIMI}'
          value: '1'
          description: 'Set to 0 on hosts without BIMI to suppress BIMI record missing alerts.'
        - macro: '{$CHECK_DMARC_RUA}'
          value: '0'
          description: 'Set to 1 to alert when DMARC record is present but rua= is not configured. Default 0 (off) — rua= is optional per RFC 7489.'
        - macro: '{$CHECK_DNSSEC}'
          value: '1'
          description: 'Set to 0 on hosts without DNSSEC to suppress DNSSEC AD flag and DS record alerts.'
        - macro: '{$CHECK_IPV6}'
          value: '0'
          description: 'Set to 1 to enable IPv6 (AAAA) record checks.'
        - macro: '{$CHECK_MTA_STS}'
          value: '1'
          description: 'Set to 0 on hosts without MTA-STS to suppress MTA-STS record missing alerts.'
        - macro: '{$CHECK_TLS_RPT}'
          value: '1'
          description: 'Set to 0 on hosts without TLS-RPT to suppress TLS-RPT record missing alerts.'
        - macro: '{$CIDR_ALLOWLIST}'
          description: 'Comma-separated list of CIDR networks allowed in SPF records.'
        - macro: '{$DKIM_SELECTORS}'
          value: default
          description: 'DKIM селекторы без ._domainkey, через запятую без пробелов. Примеры: default | default,mail | dkim1,mx'
        - macro: '{$DNSBL_CACHE_TTL_SEC}'
          value: '1200'
          description: 'Time in seconds to cache DNSBL check results locally to respect provider limits.'
        - macro: '{$DNSBL_MAX_IP}'
          value: '5'
          description: 'Maximum number of unique MX IPs to check against DNSBL zones and PTR/FCrDNS. PTR is checked for every discovered address regardless; this caps only the blocklist queries, and the addresses left out are counted by mail.dnsbl.not_checked. Measured over 35 mail domains: 1 covers 27% of addresses and 17% of domains fully, 5 covers 82% and 86%, 10 covers 96% and 97%. Cost is linear at roughly +5 DNS queries per extra address. Note that 0 means NO limit, not "check nothing".'
        - macro: '{$DNSBL_TEST_IP}'
          value: '127.0.0.2'
          description: "Canary address for proving each DNSBL zone is alive. Every working blocklist lists 127.0.0.2 by convention, so a zone that does NOT return it is either emptied (like SORBS after 2024) or refusing our queries - and its 'not listed' verdicts are worthless. Leave empty to switch the self-test off."
        - macro: '{$DNSBL_ZONES}'
          value: 'zen.spamhaus.org,b.barracudacentral.org'
          description: 'Comma-separated list of DNSBL zones to check against.'
        - macro: '{$DNS_RESOLVER}'
          value: ''
          description: 'IP addresses of DNS resolvers, comma-separated. If empty (default), system resolvers from resolv.conf will be used. Examples: 127.0.0.1,9.9.9.10 | 1.1.1.1,8.8.8.8. Previous list for reference: 127.0.0.1,9.9.9.10,149.112.112.10,208.67.222.222,208.67.220.220,8.26.56.26,8.20.247.20,95.85.95.85,2.56.220.2,62.76.76.62,62.76.62.76,195.208.4.1,195.208.5.1. For DNSBL, prefer a local recursive resolver (Unbound/Bind) trusted in your network; public resolvers are often policy-blocked. With multiple resolvers, load is distributed (see {$DNS_SHUFFLE}=1 by default); set {$DNS_SHUFFLE}=0 to keep order.'
        - macro: '{$DNS_SHUFFLE}'
          value: '1'
          description: 'Shuffle resolver list each run to distribute load across resolvers (1=shuffle, 0=keep order from {$DNS_RESOLVER}).'
        - macro: '{$DNS_SLOW_MS}'
          value: '12000'
          description: 'Threshold in milliseconds for triggering slow DNS response alert.'
        - macro: '{$DNS_TIMEOUT_SEC}'
          value: '10'
          description: 'Timeout in seconds for a single DNS query.'
        - macro: '{$MAX_MX_CHECK}'
          value: '5'
          description: 'Maximum number of MX records to process for discovery and detailed checks.'
        - macro: '{$MAIL_CLIENT_AUTOCONFIG_CHECK}'
          value: '1'
          description: 'Set to 0 on hosts that intentionally have no autoconfig/autodiscover DNS records to suppress mail client autoconfiguration alerts.'
        - macro: '{$MAIL_DNS_NODATA_SEC}'
          value: '3h'
          description: 'How long the master item may produce nothing before "script not running" fires. Must exceed twice the item update interval — at the default 1h poll a 30m window would be true for half of every hour and the trigger would flap permanently, which is what the original 1800 value did. Zabbix will not evaluate periods under 30 seconds and rejects 0.'
        - macro: '{$SPF_CHECK_MX_COVERAGE}'
          value: '1'
          description: 'Set to 1 to alert when MX hosts are not authorized in SPF (default for standalone mail servers). Set to 0 on hosts where MX is intentionally receive-only and does not send outbound mail.'
        - macro: '{$SPF_EXPECT_ALL}'
          value: '-all|~all'
          description: 'Regex for expected "all" mechanism in SPF. Usually "-all" (Fail) or "~all" (SoftFail) is recommended.'
        - macro: '{$SPF_MAX_LOOKUPS}'
          value: '10'
          description: 'Maximum number of DNS lookups allowed for SPF record according to RFC 7208.'
        - macro: '{$TEMPLATE_VERSION}'
          value: 0.1.60
          description: 'Template version identifier for Mail DNS Audit.'
      dashboards:
        - uuid: 1a2b3c4d5e6f4a7b8c9d0e1f2a3b4c5d
