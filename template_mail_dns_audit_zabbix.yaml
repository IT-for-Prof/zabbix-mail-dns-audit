zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: a571c0d144b14fd4a87a9d9b2aa9fcd6
    name: Templates/Applications
  templates:
  - uuid: 5f2a484eee7342a7bf440c60fcebca00
    template: 'Template Mail DNS Audit Zabbix'
    name: 'Template Mail DNS Audit Zabbix'
    description: |
      Comprehensive Mail DNS Posture Audit.
      Version: 0.1.18
      Repo: https://github.com/IT-for-Prof/zabbix-mail-dns-audit
      itforprof.com by Konstantin Tyutyunnik

      Monitors:
      - MX records (presence, changes, TTL)
      - SPF (RFC compliance, lookup count, ptr usage, CIDR allowlist)
      - DMARC (presence, policy details: p, rua, sp)
      - DKIM (public key presence and changes)
      - DNSBL (IP listing with normalized statuses: LISTED, POLICY/ERROR, CHECK FAILED)
      - DNSSEC (DS records)
      - NS and SOA records
      - Duplicate DNS records: MX, DMARC, DKIM selectors, NS, SOA
    groups:
    - name: Templates/Applications
    macros:
    - macro: '{$DNS_RESOLVER}'
      value: '127.0.0.1,9.9.9.10,149.112.112.10,208.67.222.222,208.67.220.220,8.26.56.26,8.20.247.20,95.85.95.85,2.56.220.2,62.76.76.62,62.76.62.76,195.208.4.1,195.208.5.1'
      description: >
        IP addresses of DNS resolvers, comma-separated. If empty, system resolvers from resolv.conf will be used.
        For DNSBL, prefer a local recursive resolver (Unbound/Bind) trusted in your network; public resolvers are often policy-blocked.
        With multiple resolvers, load is distributed (see {$DNS_SHUFFLE}=1 by default); set {$DNS_SHUFFLE}=0 to keep order.
    - macro: '{$DNS_TIMEOUT_SEC}'
      value: '3'
      description: 'Timeout in seconds for a single DNS query.'
    - macro: '{$SPF_MAX_LOOKUPS}'
      value: '10'
      description: 'Maximum number of DNS lookups allowed for SPF record according to RFC 7208.'
    - macro: '{$DNS_SLOW_MS}'
      value: '3000'
      description: 'Threshold in milliseconds for triggering slow DNS response alert.'
    - macro: '{$DNSBL_ZONES}'
      value: 'zen.spamhaus.org,bl.spamcop.net'
      description: 'Comma-separated list of DNSBL zones to check against.'
    - macro: '{$CIDR_ALLOWLIST}'
      value: ''
      description: 'Comma-separated list of CIDR networks allowed in SPF records.'
    - macro: '{$SPF_EXPECT_ALL}'
      value: '-all|~all'
      description: 'Regex for expected "all" mechanism in SPF. Usually "-all" (Fail) or "~all" (SoftFail) is recommended.'
    - macro: '{$CHECK_IPV6}'
      value: '0'
      description: 'Set to 1 to enable IPv6 (AAAA) record checks.'
    - macro: '{$DNSBL_CACHE_TTL_SEC}'
      value: '1200'
      description: 'Time in seconds to cache DNSBL check results locally to respect provider limits.'
    - macro: '{$MAX_MX_CHECK}'
      value: '5'
      description: 'Maximum number of MX records to process for discovery and detailed checks.'
    - macro: '{$DNSBL_MAX_IP}'
      value: '1'
      description: 'Maximum number of unique IPs to check against DNSBL zones to avoid rate limiting.'
    - macro: '{$DKIM_SELECTORS}'
      value: 'default'
      description: 'Comma-separated list of DKIM selectors to monitor for changes.'
    - macro: '{$MAIL_DNS_NODATA_SEC}'
      value: '1800'
      description: 'nodata threshold (seconds) for mail.dns.audit master item.'
    - macro: '{$TEMPLATE_VERSION}'
      value: '0.1.18'
      description: 'Template version identifier for Mail DNS Audit.'
    - macro: '{$DNS_SHUFFLE}'
      value: '1'
      description: 'Shuffle resolver list each run to distribute load across resolvers (1=shuffle, 0=keep order from {$DNS_RESOLVER}).'
    items:
    - uuid: 1e473855a1ed43c587679ee100a197c8
      name: 'Mail DNS audit raw'
      key: 'mail.dns.audit[{HOST.NAME},{$DNS_RESOLVER},{$DNS_TIMEOUT_SEC},{$CHECK_IPV6},{$DNSBL_ZONES},{$CIDR_ALLOWLIST},{$SPF_MAX_LOOKUPS},{$SPF_EXPECT_ALL},{$DNSBL_CACHE_TTL_SEC},{$MAX_MX_CHECK},{$DNSBL_MAX_IP},{$DKIM_SELECTORS},{$DNS_SHUFFLE}]'
      type: EXTERNAL
      value_type: TEXT
      trends: '0'
      history: 1d
      delay: 1h
      description: 'Master item that executes the external Python script. It returns a comprehensive JSON object containing all DNS posture data.'
      triggers:
      - uuid: 88ac94f780d74cd78061580107d1cc69
        expression: 'last(/Template Mail DNS Audit Zabbix/mail.mx.count)=0'
        name: 'No MX records (count={ITEM.LASTVALUE1})'
        priority: HIGH
        description: 'The domain has no MX records configured. Email delivery will likely fail or fall back to A record.'
        dependencies:
        - name: 'External script error: {ITEM.LASTVALUE}'
          expression: 'length(last(/Template Mail DNS Audit Zabbix/mail.dns.error))>0'
        tags:
        - tag: component
          value: mail-dns
        - tag: Application
          value: Mail DNS
      - uuid: 07a2f04d6e9d46c9bf3c15f61643c999
        name: 'External script non-JSON output: {ITEM.LASTVALUE}'
        expression: 'regexp(last(/Template Mail DNS Audit Zabbix/mail.dns.audit[{HOST.NAME},{$DNS_RESOLVER},{$DNS_TIMEOUT_SEC},{$CHECK_IPV6},{$DNSBL_ZONES},{$CIDR_ALLOWLIST},{$SPF_MAX_LOOKUPS},{$SPF_EXPECT_ALL},{$DNSBL_CACHE_TTL_SEC},{$MAX_MX_CHECK},{$DNSBL_MAX_IP},{$DKIM_SELECTORS},{$DNS_SHUFFLE}]),\"^[{\\\\[]\")=0'
        priority: WARNING
        description: 'External check returned non-JSON (e.g., \"env: can''t execute python3\"). Actions: ensure python3 + py3-dnspython installed in Zabbix server container, script is executable in /usr/lib/zabbix/externalscripts, resolver/network reachable. For DNSBL, use a local trusted resolver, not a public one.'
        manual_close: 'YES'
        tags:
        - tag: component
          value: mail-dns
        - tag: Application
          value: Mail DNS
      - uuid: 07a2f04d6e9d46c9bf3c15f61643c318
        name: 'External script error: {ITEM.LASTVALUE}'
        expression: 'length(last(/Template Mail DNS Audit Zabbix/mail.dns.error))>0'
        priority: WARNING
        description: 'The external python script mail.dns.audit encountered an internal error or timeout. Check Zabbix server logs.'
        tags:
        - tag: component
          value: mail-dns
        - tag: Application
          value: Mail DNS
      - uuid: bdb6414d685540c399cb00d95074d38b
        expression: 'last(/Template Mail DNS Audit Zabbix/mail.spf.multiple)=1'
        name: 'Multiple SPF records (flag={ITEM.LASTVALUE1})'
        priority: HIGH
        description: 'More than one SPF record found. This is a violation of RFC 7208 and will lead to SPF Permanent Error.'
        dependencies:
        - name: 'External script error: {ITEM.LASTVALUE}'
          expression: 'length(last(/Template Mail DNS Audit Zabbix/mail.dns.error))>0'
        tags:
        - tag: component
          value: mail-dns
        - tag: Application
          value: Mail DNS
      - uuid: 9c1ef7e4c8d04f4b96f8f1a2b7c6d5e4
        expression: 'last(/Template Mail DNS Audit Zabbix/mail.dup.mx)=1'
        name: 'Duplicate MX records detected'
        priority: WARNING
        description: 'Multiple identical MX entries (same priority/host) detected. Clean up duplicates to avoid resolver inconsistencies.'
        dependencies:
        - name: 'External script error: {ITEM.LASTVALUE}'
          expression: 'length(last(/Template Mail DNS Audit Zabbix/mail.dns.error))>0'
        tags:
        - tag: component
          value: mail-dns
        - tag: Application
          value: Mail DNS
      - uuid: 8b7a6c5d4e3f4a2b1c0d9e8f7a6b5c4d
        expression: 'last(/Template Mail DNS Audit Zabbix/mail.dup.dmarc)=1'
        name: 'Multiple DMARC TXT records detected'
        priority: WARNING
        description: 'More than one DMARC record (_dmarc.<domain>) found. Receivers may ignore the policy; leave only one v=DMARC1 TXT.'
        dependencies:
        - name: 'External script error: {ITEM.LASTVALUE}'
          expression: 'length(last(/Template Mail DNS Audit Zabbix/mail.dns.error))>0'
        tags:
        - tag: component
          value: mail-dns
        - tag: Application
          value: Mail DNS
      - uuid: 7c6b5a4d3e2f4a1b0c9d8e7f6a5b4c3d
        expression: 'last(/Template Mail DNS Audit Zabbix/mail.dup.dkim)=1'
        name: 'Duplicate DKIM TXT per selector detected'
        priority: WARNING
        description: 'Selectors with more than one DKIM TXT found. Clean up duplicates to prevent verification ambiguity.'
        dependencies:
        - name: 'External script error: {ITEM.LASTVALUE}'
          expression: 'length(last(/Template Mail DNS Audit Zabbix/mail.dns.error))>0'
        tags:
        - tag: component
          value: mail-dns
        - tag: Application
          value: Mail DNS
      - uuid: 6b5a4c3d2e1f4a5b6c7d8e9f0a1b2c3d
        expression: 'last(/Template Mail DNS Audit Zabbix/mail.dup.ns)=1'
        name: 'Duplicate NS records detected'
        priority: WARNING
        description: 'Identical NS names repeated in the zone. Clean up duplicates to keep delegation tidy.'
        dependencies:
        - name: 'External script error: {ITEM.LASTVALUE}'
          expression: 'length(last(/Template Mail DNS Audit Zabbix/mail.dns.error))>0'
        tags:
        - tag: component
          value: mail-dns
        - tag: Application
          value: Mail DNS
      - uuid: 5a4b3c2d1e0f4a5b6c7d8e9f0a1b2c3d
        expression: 'last(/Template Mail DNS Audit Zabbix/mail.dup.soa)=1'
        name: 'Multiple SOA records detected'
        priority: WARNING
        description: 'More than one SOA record returned. This is non-standard and should be corrected.'
        dependencies:
        - name: 'External script error: {ITEM.LASTVALUE}'
          expression: 'length(last(/Template Mail DNS Audit Zabbix/mail.dns.error))>0'
        tags:
        - tag: component
          value: mail-dns
        - tag: Application
          value: Mail DNS
      - uuid: 4f3e2d1c0b9a8f7e6d5c4b3a29180706
        expression: 'nodata(/Template Mail DNS Audit Zabbix/mail.dns.audit[{HOST.NAME},{$DNS_RESOLVER},{$DNS_TIMEOUT_SEC},{$CHECK_IPV6},{$DNSBL_ZONES},{$CIDR_ALLOWLIST},{$SPF_MAX_LOOKUPS},{$SPF_EXPECT_ALL},{$DNSBL_CACHE_TTL_SEC},{$MAX_MX_CHECK},{$DNSBL_MAX_IP},{$DKIM_SELECTORS},{$DNS_SHUFFLE}],{$MAIL_DNS_NODATA_SEC})=1'
        name: 'No data from mail.dns.audit (>{$MAIL_DNS_NODATA_SEC}s)'
        priority: WARNING
        description: 'Master item returned no data within the configured nodata window. Possible causes: script timeout, resolver issues, or host unreachable.'
        tags:
        - tag: component
          value: mail-dns
        - tag: Application
          value: Mail DNS
      - uuid: a30109b528a345d99c651580b13aa325
        expression: 'last(/Template Mail DNS Audit Zabbix/mail.spf.lookup_estimate)>{$SPF_MAX_LOOKUPS}'
        name: 'SPF lookup estimate {ITEM.LASTVALUE1}>{$SPF_MAX_LOOKUPS}'
        priority: HIGH
        description: 'The SPF record requires too many DNS lookups (RFC limit is 10). Receiving servers will likely treat this as a PermError.'
        dependencies:
        - name: 'External script error: {ITEM.LASTVALUE}'
          expression: 'length(last(/Template Mail DNS Audit Zabbix/mail.dns.error))>0'
        tags:
        - tag: component
          value: mail-dns
        - tag: Application
          value: Mail DNS
      - uuid: 0c265436e12e4d26843c72327c9063d9
        expression: 'last(/Template Mail DNS Audit Zabbix/mail.dnsbl.listed_count)>0'
        name: 'MX IP listed in DNSBL (count={ITEM.LASTVALUE1})'
        priority: HIGH
        manual_close: 'YES'
        description: 'One or more of the domain MX IP addresses are listed in a DNSBL. This may lead to outgoing emails being blocked or marked as spam.'
        dependencies:
        - name: 'External script error: {ITEM.LASTVALUE}'
          expression: 'length(last(/Template Mail DNS Audit Zabbix/mail.dns.error))>0'
        tags:
        - tag: component
          value: mail-dns
        - tag: Application
          value: Mail DNS
      - uuid: e6a34c97d3f143228fce0c223743dd0e
        expression: 'last(/Template Mail DNS Audit Zabbix/mail.dnsbl.policy_error.count)>0'
        name: 'DNSBL policy/error responses (count={ITEM.LASTVALUE1})'
        priority: WARNING
        manual_close: 'YES'
        description: 'DNSBL provider returned policy/error codes (127.255.x.x or TXT policy markers). Use a trusted/non-public resolver allowed by DNSBL; avoid public resolvers that trigger open-resolver blocks.'
        dependencies:
        - name: 'External script error: {ITEM.LASTVALUE}'
          expression: 'length(last(/Template Mail DNS Audit Zabbix/mail.dns.error))>0'
        tags:
        - tag: component
          value: mail-dns
        - tag: Application
          value: Mail DNS
      - uuid: 4cc7be4c6e9c4a87af7c4833c1f3d953
        expression: 'last(/Template Mail DNS Audit Zabbix/mail.dnsbl.check_failed.count)>0'
        name: 'DNSBL checks failed (count={ITEM.LASTVALUE1})'
        priority: WARNING
        manual_close: 'YES'
        description: 'Technical failures during DNSBL lookups (timeouts, SERVFAIL, empty responses). Investigate resolver or DNSBL reachability.'
        dependencies:
        - name: 'External script error: {ITEM.LASTVALUE}'
          expression: 'length(last(/Template Mail DNS Audit Zabbix/mail.dns.error))>0'
        tags:
        - tag: component
          value: mail-dns
        - tag: Application
          value: Mail DNS
      - uuid: 17ddd2651410461fa0b12060e5e17ab9
        name: 'DMARC policy is none or missing'
        expression: 'last(/Template Mail DNS Audit Zabbix/mail.dmarc.policy)="none" or last(/Template Mail DNS Audit Zabbix/mail.dmarc.present)=0'
        priority: INFO
        description: 'DMARC policy "p=none" (monitor mode) provides no protection against spoofing. "p=quarantine" or "p=reject" is recommended.'
        dependencies:
        - name: 'External script error: {ITEM.LASTVALUE}'
          expression: 'length(last(/Template Mail DNS Audit Zabbix/mail.dns.error))>0'
        tags:
        - tag: component
          value: mail-dns
        - tag: Application
          value: Mail DNS
      - uuid: 98592b10f91744a3b2099cd4141da81a
        expression: 'last(/Template Mail DNS Audit Zabbix/mail.spf.has_ptr)=1'
        name: 'SPF contains ptr (flag={ITEM.LASTVALUE1})'
        priority: AVERAGE
        description: 'The "ptr" mechanism in SPF is deprecated and should not be used as it is slow and unreliable.'
        dependencies:
        - name: 'External script error: {ITEM.LASTVALUE}'
          expression: 'length(last(/Template Mail DNS Audit Zabbix/mail.dns.error))>0'
        tags:
        - tag: component
          value: mail-dns
        - tag: Application
          value: Mail DNS
      - uuid: 1761e82a259f4583b720f2835fabd5bd
        expression: 'last(/Template Mail DNS Audit Zabbix/mail.mx.unresolved.count)>0'
        name: 'Unresolved SPF a/mx mechanisms (count={ITEM.LASTVALUE1})'
        priority: AVERAGE
        description: 'Some "a" or "mx" mechanisms in the SPF record point to hosts that do not have DNS records.'
        dependencies:
        - name: 'External script error: {ITEM.LASTVALUE}'
          expression: 'length(last(/Template Mail DNS Audit Zabbix/mail.dns.error))>0'
        tags:
        - tag: component
          value: mail-dns
        - tag: Application
          value: Mail DNS
      - uuid: a9c8de5801434b4ba2e69da75529254b
        expression: 'last(/Template Mail DNS Audit Zabbix/mail.spf.all_policy_ok)=0'
        name: 'SPF all mechanism mismatch (all={Template Mail DNS Audit Zabbix:mail.spf.all_mechanism.last()})'
        priority: WARNING
        description: 'The "all" mechanism in SPF is not using recommended policy (-all or ~all).'
        dependencies:
        - name: 'External script error: {ITEM.LASTVALUE}'
          expression: 'length(last(/Template Mail DNS Audit Zabbix/mail.dns.error))>0'
        tags:
        - tag: component
          value: mail-dns
        - tag: Application
          value: Mail DNS
      - uuid: b3f03e1f33ca4cb391370144a74eaee6
        expression: 'last(/Template Mail DNS Audit Zabbix/mail.spf.cidr_out_of_allowlist.count)>0'
        name: 'SPF CIDR outside allowlist (count={ITEM.LASTVALUE1})'
        priority: WARNING
        description: 'Found IP networks in SPF record that are not present in your allowed list ({$CIDR_ALLOWLIST}).'
        dependencies:
        - name: 'External script error: {ITEM.LASTVALUE}'
          expression: 'length(last(/Template Mail DNS Audit Zabbix/mail.dns.error))>0'
        tags:
        - tag: component
          value: mail-dns
        - tag: Application
          value: Mail DNS
      - uuid: ac21e3ee86544705868bf6448a434d56
        expression: 'min(/Template Mail DNS Audit Zabbix/mail.dns.query_time_ms,5m)>{$DNS_SLOW_MS}'
        name: 'Slow DNS responses (min 5m={ITEM.LASTVALUE1})'
        priority: INFO
        manual_close: 'YES'
        description: 'DNS queries for the domain are consistently taking more than {$DNS_SLOW_MS}ms.'
        dependencies:
        - name: 'External script error: {ITEM.LASTVALUE}'
          expression: 'length(last(/Template Mail DNS Audit Zabbix/mail.dns.error))>0'
        tags:
        - tag: component
          value: mail-dns
        - tag: Application
          value: Mail DNS
      - uuid: 35a6e5a59a6a41d69c1b8e4d1809d46c
        name: 'MX records changed'
        expression: 'change(/Template Mail DNS Audit Zabbix/mail.mx.hash)=1'
        priority: WARNING
        description: 'MX records for the domain have been modified. Verify if this change was intended.'
        dependencies:
        - name: 'External script error: {ITEM.LASTVALUE}'
          expression: 'length(last(/Template Mail DNS Audit Zabbix/mail.dns.error))>0'
        tags:
        - tag: component
          value: mail-dns
        - tag: Application
          value: Mail DNS
      - uuid: 1e6d308b547a47018dfd26831e996c5c
        name: 'SPF record changed'
        expression: 'change(/Template Mail DNS Audit Zabbix/mail.spf.hash)=1'
        priority: WARNING
        description: 'SPF record for the domain has been modified. Verify if this change was intended.'
        dependencies:
        - name: 'External script error: {ITEM.LASTVALUE}'
          expression: 'length(last(/Template Mail DNS Audit Zabbix/mail.dns.error))>0'
        tags:
        - tag: component
          value: mail-dns
        - tag: Application
          value: Mail DNS
      - uuid: a987547227254b30885f56a9e5ac155f
        name: 'DMARC record changed'
        expression: 'change(/Template Mail DNS Audit Zabbix/mail.dmarc.hash)=1'
        priority: WARNING
        description: 'DMARC record for the domain has been modified.'
        dependencies:
        - name: 'External script error: {ITEM.LASTVALUE}'
          expression: 'length(last(/Template Mail DNS Audit Zabbix/mail.dns.error))>0'
        tags:
        - tag: component
          value: mail-dns
        - tag: Application
          value: Mail DNS
      - uuid: edb01bb7f6134caba8873194951c6b93
        name: 'DKIM record changed'
        expression: 'change(/Template Mail DNS Audit Zabbix/mail.dkim.hash)=1'
        priority: WARNING
        description: 'One or more DKIM public key records have been modified.'
        dependencies:
        - name: 'External script error: {ITEM.LASTVALUE}'
          expression: 'length(last(/Template Mail DNS Audit Zabbix/mail.dns.error))>0'
        tags:
        - tag: component
          value: mail-dns
        - tag: Application
          value: Mail DNS
      - uuid: 9aaa0c08a49c495bb50b47a0993e9a07
        name: 'DS record changed'
        expression: 'change(/Template Mail DNS Audit Zabbix/mail.ds.hash)=1'
        priority: WARNING
        description: 'DNSSEC DS record has been modified.'
        dependencies:
        - name: 'External script error: {ITEM.LASTVALUE}'
          expression: 'length(last(/Template Mail DNS Audit Zabbix/mail.dns.error))>0'
        tags:
        - tag: component
          value: mail-dns
        - tag: Application
          value: Mail DNS
      - uuid: 45326a92daa641689aef499e1f64ae34
        name: 'NS record changed'
        expression: 'change(/Template Mail DNS Audit Zabbix/mail.ns.hash)=1'
        priority: WARNING
        description: 'Name server (NS) records for the domain have been modified.'
        dependencies:
        - name: 'External script error: {ITEM.LASTVALUE}'
          expression: 'length(last(/Template Mail DNS Audit Zabbix/mail.dns.error))>0'
        tags:
        - tag: component
          value: mail-dns
        - tag: Application
          value: Mail DNS
      - uuid: 06ff6ba18ae040469f3bc1e4543f1da1
        name: 'SOA serial changed'
        expression: 'change(/Template Mail DNS Audit Zabbix/mail.soa.hash)=1'
        priority: WARNING
        description: 'The serial number in the SOA record has changed, indicating a zone update.'
        dependencies:
        - name: 'External script error: {ITEM.LASTVALUE}'
          expression: 'length(last(/Template Mail DNS Audit Zabbix/mail.dns.error))>0'
        tags:
        - tag: component
          value: mail-dns
        - tag: Application
          value: Mail DNS
      tags:
      - tag: component
        value: mail-dns
      - tag: Application
        value: Mail DNS
      - uuid: c1d2e3f4a5b697887766554433221100
        expression: 'last(/Template Mail DNS Audit Zabbix/mail.dkim.present)=0'
        name: 'DKIM record missing'
        priority: HIGH
        description: 'No DKIM TXT records were found for the configured selectors. Publish at least one DKIM key (TXT at selector._domainkey.<domain>).'
        dependencies:
        - name: 'External script error: {ITEM.LASTVALUE}'
          expression: 'length(last(/Template Mail DNS Audit Zabbix/mail.dns.error))>0'
        tags:
        - tag: component
          value: mail-dns
        - tag: Application
          value: Mail DNS
      - uuid: d2e3f4a5b6c7988877665544332211aa
        expression: 'last(/Template Mail DNS Audit Zabbix/mail.dnssec.ds_present)=0'
        name: 'DNSSEC DS missing'
        priority: INFORMATION
        description: 'No DNSSEC DS records detected for the domain. If DNSSEC is expected, publish DS at the registrar.'
        dependencies:
        - name: 'External script error: {ITEM.LASTVALUE}'
          expression: 'length(last(/Template Mail DNS Audit Zabbix/mail.dns.error))>0'
        tags:
        - tag: component
          value: mail-dns
        - tag: Application
          value: Mail DNS
      - uuid: e3f4a5b6c7d8988877665544332211bb
        expression: 'last(/Template Mail DNS Audit Zabbix/mail.dnssec.ad_flag)=0'
        name: 'DNSSEC AD flag missing'
        priority: INFORMATION
        description: 'Resolver responses were not validated with DNSSEC (AD flag not set). Ensure validating resolver or check DNSSEC chain.'
        dependencies:
        - name: 'External script error: {ITEM.LASTVALUE}'
          expression: 'length(last(/Template Mail DNS Audit Zabbix/mail.dns.error))>0'
        tags:
        - tag: component
          value: mail-dns
        - tag: Application
          value: Mail DNS
    - uuid: 194568ad5974479dadcbeb72479625e7
      name: 'MX count'
      key: mail.mx.count
      type: DEPENDENT
      master_item:
        key: 'mail.dns.audit[{HOST.NAME},{$DNS_RESOLVER},{$DNS_TIMEOUT_SEC},{$CHECK_IPV6},{$DNSBL_ZONES},{$CIDR_ALLOWLIST},{$SPF_MAX_LOOKUPS},{$SPF_EXPECT_ALL},{$DNSBL_CACHE_TTL_SEC},{$MAX_MX_CHECK},{$DNSBL_MAX_IP},{$DKIM_SELECTORS},{$DNS_SHUFFLE}]'
      value_type: UNSIGNED
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.mx.length()
      description: 'Total number of MX records found for the domain.'
      tags:
      - tag: Application
        value: Mail DNS
    - uuid: 5f2a484eee7342a7bf440c60fcebca01
      name: 'Unresolved MX targets'
      key: mail.mx.unresolved.count
      type: DEPENDENT
      master_item:
        key: 'mail.dns.audit[{HOST.NAME},{$DNS_RESOLVER},{$DNS_TIMEOUT_SEC},{$CHECK_IPV6},{$DNSBL_ZONES},{$CIDR_ALLOWLIST},{$SPF_MAX_LOOKUPS},{$SPF_EXPECT_ALL},{$DNSBL_CACHE_TTL_SEC},{$MAX_MX_CHECK},{$DNSBL_MAX_IP},{$DKIM_SELECTORS},{$DNS_SHUFFLE}]'
      value_type: UNSIGNED
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.spf_analysis.unresolved_mx_mechanisms.length()
